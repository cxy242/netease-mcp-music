<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一起听</title>
<style>
/* ============ BASE RESET ============ */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow-x:hidden;min-height:100vh;transition:background .6s,color .6s}

/* ============ THEME VARIABLES ============ */
:root{
  --accent:#ff1744;--bg:#0a0a0a;--card:rgba(20,20,20,.92);--text:#e0e0e0;--text2:#888;
  --glass:rgba(255,255,255,.06);--glass-border:rgba(255,23,68,.25);--glass-blur:16px;
}
body.theme-sakura{
  --accent:#ff69b4;--bg:#1a0a2e;--card:rgba(30,15,50,.88);--text:#f0d0e8;--text2:#b080c0;
  --glass:rgba(255,105,180,.08);--glass-border:rgba(255,105,180,.3);
}
body.theme-ocean{
  --accent:#00e5ff;--bg:#020c1b;--card:rgba(10,25,47,.88);--text:#b0e0f0;--text2:#5090b0;
  --glass:rgba(0,229,255,.06);--glass-border:rgba(0,229,255,.25);
}
body.theme-mint{
  --accent:#10b981;--bg:#f0fdf4;--card:rgba(255,255,255,.95);--text:#064e3b;--text2:#6b8f7b;
  --glass:rgba(16,185,129,.08);--glass-border:rgba(16,185,129,.3);
}

/* ============ THEME BACKGROUNDS ============ */
/* Cat theme bg: pixel grid */
body.theme-cat{background:#0a0a0a;background-image:
  linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:20px 20px}

/* Sakura theme bg */
body.theme-sakura{background:linear-gradient(135deg,#1a0a2e,#2d1b4e)}

/* Ocean theme bg */
body.theme-ocean{background:linear-gradient(180deg,#020c1b,#0a192f 50%,#0d2137)}

/* Mint theme bg */
body.theme-mint{background:linear-gradient(180deg,#fff,#f0fdf4)}

/* Default (cat) bg */
body{background:#0a0a0a;background-image:
  linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:20px 20px}

/* ============ ANIMATED BG LAYERS ============ */
.bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}

/* Stars for sakura theme */
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.2}100%{opacity:1}}

/* Sakura petals */
.sakura-petal{position:absolute;top:-20px;width:14px;height:10px;
  background:linear-gradient(135deg,#ffb7c5,#ff69b4);
  border-radius:80% 0 50% 50%;animation:petalFall var(--d,10s) linear infinite;
  animation-delay:var(--delay,0s);opacity:.7}
@keyframes petalFall{
  0%{transform:translateY(0) translateX(0) rotateY(0) rotateZ(0);opacity:.8}
  50%{transform:translateY(50vh) translateX(30px) rotateY(180deg) rotateZ(90deg);opacity:.6}
  100%{transform:translateY(110vh) translateX(-20px) rotateY(360deg) rotateZ(180deg);opacity:.3}
}

/* Aurora for sakura */
.aurora{position:absolute;top:0;left:0;width:200%;height:180px;
  background:linear-gradient(90deg,transparent,rgba(0,255,128,.15),rgba(180,0,255,.12),rgba(255,0,128,.1),transparent);
  animation:auroraMove 12s ease-in-out infinite alternate;filter:blur(40px)}
@keyframes auroraMove{0%{transform:translateX(-30%)}100%{transform:translateX(0)}}

/* Bubbles for ocean */
.bubble{position:absolute;bottom:-30px;border:1.5px solid rgba(0,229,255,.35);border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(0,229,255,.15),transparent);
  animation:bubbleRise var(--d,10s) linear infinite;animation-delay:var(--delay,0s)}
@keyframes bubbleRise{
  0%{transform:translateY(0) translateX(0);opacity:.7}
  25%{transform:translateY(-25vh) translateX(15px);opacity:.6}
  50%{transform:translateY(-50vh) translateX(-10px);opacity:.5}
  75%{transform:translateY(-75vh) translateX(12px);opacity:.3}
  100%{transform:translateY(-110vh) translateX(0);opacity:0}
}

/* Jellyfish for ocean */
.jellyfish{position:absolute;animation:jellyFloat var(--d,6s) ease-in-out infinite alternate}
.jelly-bell{width:60px;height:45px;border-radius:50% 50% 40% 40%;
  background:radial-gradient(ellipse at 50% 40%,rgba(0,229,255,.3),rgba(0,180,255,.15));
  border:1px solid rgba(0,229,255,.3);
  box-shadow:0 0 20px rgba(0,229,255,.2),0 0 40px rgba(0,229,255,.1);position:relative}
.jelly-tentacle{position:absolute;bottom:-25px;width:1.5px;height:25px;
  background:linear-gradient(to bottom,rgba(0,229,255,.4),transparent);
  border-radius:0 0 50% 50%;transform-origin:top center;animation:tentacleWave 2s ease-in-out infinite alternate}
.jelly-tentacle:nth-child(2){left:15px;animation-delay:.3s}
.jelly-tentacle:nth-child(3){left:30px;animation-delay:.6s}
.jelly-tentacle:nth-child(4){left:45px;animation-delay:.9s}
.jelly-tentacle:nth-child(5){left:55px;animation-delay:1.2s}
@keyframes jellyFloat{0%{transform:translateY(0) translateX(0)}100%{transform:translateY(-20px) translateX(10px)}}
@keyframes tentacleWave{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}

/* Caustic light for ocean */
.caustic{position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse 300px 200px at var(--cx,50%) var(--cy,30%),rgba(0,229,255,.06),transparent);
  animation:causticMove 8s ease-in-out infinite alternate}
@keyframes causticMove{
  0%{--cx:30%;--cy:20%}33%{--cx:60%;--cy:35%}66%{--cx:40%;--cy:50%}100%{--cx:70%;--cy:25%}
}

/* Mint confetti */
.confetti{position:absolute;border-radius:2px;opacity:.5;animation:confettiFloat var(--d,10s) ease-in-out infinite;animation-delay:var(--delay,0s)}
.confetti.circle{border-radius:50%}
.confetti.triangle{width:0!important;height:0!important;background:transparent!important;
  border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--c,#ffb7c5)}
@keyframes confettiFloat{
  0%{transform:translateY(100vh) rotate(0)}50%{transform:translateY(50vh) rotate(180deg)}
  100%{transform:translateY(-10vh) rotate(360deg)}
}

/* Cat paw prints */
.paw-print{position:absolute;opacity:.04;width:30px;height:30px}
.paw-print::before{content:'';position:absolute;width:14px;height:12px;background:var(--accent);border-radius:50%;top:10px;left:8px}
.paw-print::after{content:'';position:absolute;width:6px;height:5px;background:var(--accent);border-radius:50%;
  top:2px;left:4px;box-shadow:8px 0 0 var(--accent),4px -4px 0 var(--accent)}

/* ============ UI ELEMENTS ============ */
.glass-card{background:var(--glass);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);border-radius:16px;padding:20px;transition:all .3s}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 24px;
  border-radius:25px;border:none;cursor:pointer;font-size:14px;font-weight:600;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);outline:none;position:relative;overflow:hidden}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.btn-primary:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.btn-secondary{background:var(--glass);color:var(--text);border:1px solid var(--glass-border)}
.btn-secondary:hover{background:var(--glass-border)}

.input-field{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--glass-border);
  background:var(--glass);color:var(--text);font-size:14px;outline:none;transition:border-color .3s}
.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,23,68,.1)}
body.theme-sakura .input-field:focus{box-shadow:0 0 0 3px rgba(255,105,180,.15)}
body.theme-ocean .input-field:focus{box-shadow:0 0 0 3px rgba(0,229,255,.15)}
body.theme-mint .input-field:focus{box-shadow:0 0 0 3px rgba(16,185,129,.15)}

/* ============ THEME PICKER ============ */
.theme-btn{position:fixed;top:16px;right:16px;z-index:1000;width:40px;height:40px;
  border-radius:50%;border:2px solid var(--glass-border);background:var(--glass);
  backdrop-filter:blur(10px);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
  transition:transform .2s}
.theme-btn:hover{transform:scale(1.1) rotate(15deg)}
.theme-popup{position:fixed;top:64px;right:16px;z-index:999;
  background:var(--card);border:1px solid var(--glass-border);border-radius:14px;
  padding:8px;display:none;backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.theme-popup.show{display:block;animation:popIn .25s cubic-bezier(.34,1.56,.64,1)}
.theme-option{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;
  cursor:pointer;transition:background .2s;font-size:13px;color:var(--text);white-space:nowrap}
.theme-option:hover{background:var(--glass)}
.theme-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}

@keyframes popIn{0%{opacity:0;transform:scale(.8) translateY(-10px)}100%{opacity:1;transform:scale(1) translateY(0)}}

/* ============ JOIN PAGE ============ */
.join-page{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;position:relative;z-index:1}
.join-title{font-size:42px;font-weight:800;margin-bottom:8px;
  background:linear-gradient(135deg,var(--accent),#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.join-sub{color:var(--text2);margin-bottom:32px;font-size:14px}
.join-card{max-width:400px;width:100%;text-align:center}
.join-card .input-field{margin-bottom:16px;text-align:center}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:12px;color:var(--text2)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--glass-border)}

/* ============ MAIN PAGE ============ */
.main-page{display:none;flex-direction:column;min-height:100vh;padding:16px;padding-top:64px;position:relative;z-index:1}
.room-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;margin-bottom:20px}
.room-code{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text)}
.copy-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--glass-border);
  background:var(--glass);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:all .2s}
.copy-btn:hover{background:var(--accent);color:#fff}
.exit-btn{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,60,60,.4);
  background:rgba(255,60,60,.1);color:#ff6b6b;cursor:pointer;font-size:13px;transition:all .2s}
.exit-btn:hover{background:rgba(255,60,60,.25)}

/* Avatars section */
.avatars-section{display:flex;align-items:center;justify-content:center;gap:0;margin:20px 0;position:relative;min-height:140px}
.avatar{width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;
  background:var(--glass);position:relative;transition:transform .2s;z-index:2}
.avatar:hover{transform:scale(1.08)}
.avatar-menu{position:absolute;top:80px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--glass-border);border-radius:12px;
  padding:6px;display:none;z-index:100;white-space:nowrap}
.avatar-menu.show{display:block;animation:popIn .2s ease}
.avatar-menu-item{padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);transition:background .2s}
.avatar-menu-item:hover{background:var(--glass)}

/* ============ CSS HEADPHONES ============ */
.headphones{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:60px;z-index:3;pointer-events:none}
.hp-headband{position:absolute;top:0;left:15px;right:15px;height:40px;
  border:3px solid var(--accent);border-bottom:none;border-radius:60px 60px 0 0}
.hp-cup{position:absolute;bottom:0;width:30px;height:35px;border:3px solid var(--accent);
  border-radius:8px;background:rgba(0,0,0,.3)}
.hp-cup-l{left:0}
.hp-cup-r{right:0}
.hp-cushion{position:absolute;top:4px;left:4px;width:18px;height:23px;border-radius:5px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.hp-cup-l .hp-cushion::after,.hp-cup-r .hp-cushion::after{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.06)}

/* ============ SONG INFO ============ */
.song-info{text-align:center;margin:10px 0 20px}
.song-name{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.song-artist{font-size:13px;color:var(--text2)}

/* ============ VINYL RECORD ============ */
.vinyl-container{display:flex;align-items:center;justify-content:center;gap:0;
  margin:10px auto;position:relative;width:260px;height:220px}
.vinyl{width:180px;height:180px;border-radius:50%;position:relative;
  background:conic-gradient(from 0deg,#1a1a1a,#2a2a2a,#1a1a1a,#252525,#1a1a1a,#2a2a2a,#1a1a1a,#252525,
    #1a1a1a,#2a2a2a,#1a1a1a,#252525,#1a1a1a,#2a2a2a,#1a1a1a,#252525,#1a1a1a);
  box-shadow:0 0 20px rgba(0,0,0,.5);transition:box-shadow .3s}
.vinyl.spinning{animation:vinylSpin 3s linear infinite}
@keyframes vinylSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.vinyl-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000));
  display:flex;align-items:center;justify-content:center}
.vinyl-hole{width:10px;height:10px;border-radius:50%;background:#111;border:2px solid rgba(255,255,255,.15)}
.vinyl-groove{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(255,255,255,.05)}
.vinyl-groove:nth-child(2){width:75%;height:75%}
.vinyl-groove:nth-child(3){width:88%;height:88%}
.vinyl-groove:nth-child(4){width:62%;height:62%}

/* Tonearm */
.tonearm{position:absolute;right:30px;top:20px;width:6px;height:90px;z-index:5}
.tonearm-base{position:absolute;top:0;right:0;width:14px;height:14px;border-radius:50%;
  background:var(--accent);z-index:2}
.tonearm-arm{position:absolute;top:7px;right:3px;width:3px;height:70px;
  background:linear-gradient(to bottom,var(--accent),rgba(255,255,255,.3));
  border-radius:2px;transform-origin:top center;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.tonearm-arm.playing{transform:rotate(25deg)}
.tonearm-head{position:absolute;bottom:0;left:-2px;width:7px;height:12px;
  background:var(--accent);border-radius:0 0 3px 3px}

/* ============ PROGRESS BAR ============ */
.progress-section{padding:0 20px;margin:10px 0}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;
  cursor:pointer;position:relative;transition:height .2s}
.progress-bar:hover{height:6px}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),#ff6b9d);
  width:35%;transition:width .3s;position:relative}
.progress-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s}
.progress-bar:hover .progress-fill::after{opacity:1}
.progress-times{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text2)}

/* ============ CONTROLS ============ */
.controls{display:flex;align-items:center;justify-content:center;gap:28px;margin:16px 0}
.ctrl-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--glass-border);
  background:var(--glass);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);font-size:14px}
.ctrl-btn:hover{transform:scale(1.12);border-color:var(--accent);background:rgba(255,23,68,.15)}
.ctrl-btn.play-btn{width:56px;height:56px;border-color:var(--accent);background:var(--accent);color:#fff;font-size:18px}
.ctrl-btn.play-btn:hover{transform:scale(1.15);box-shadow:0 0 20px rgba(255,23,68,.4)}
/* CSS icons for controls */
.icon-prev,.icon-next{position:relative;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.icon-prev::before,.icon-next::before{content:'';width:0;height:0;border-style:solid}
.icon-prev::before{border-width:8px 10px 8px 0;border-color:transparent currentColor transparent transparent;margin-right:4px}
.icon-prev::after{content:'';width:2px;height:16px;background:currentColor}
.icon-next::before{border-width:8px 0 8px 10px;border-color:transparent transparent transparent currentColor;margin-left:4px}
.icon-next::after{content:'';width:2px;height:16px;background:currentColor}
.icon-play{width:0;height:0;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent currentColor;margin-left:3px}
.icon-pause{display:flex;gap:4px}
.icon-pause::before,.icon-pause::after{content:'';width:4px;height:16px;background:currentColor;border-radius:1px}

/* ============ CHAT ============ */
.chat-section{flex:1;margin-top:16px;display:flex;flex-direction:column;max-height:280px;position:relative;z-index:1}
.chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;
  max-height:200px;scrollbar-width:thin;scrollbar-color:var(--glass-border) transparent}
.chat-msg{max-width:75%;padding:8px 14px;border-radius:14px;font-size:13px;line-height:1.5;
  animation:msgIn .3s ease;word-break:break-word}
.chat-msg.self{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other{align-self:flex-start;background:var(--glass);color:var(--text);
  border:1px solid var(--glass-border);border-bottom-left-radius:4px}
.chat-msg .msg-from{font-size:11px;opacity:.7;margin-bottom:2px}
.lyric-line{padding:4px 0;font-size:14px;opacity:0.5;transition:all 0.3s}
.lyric-line.active{opacity:1;font-size:16px;font-weight:600;color:var(--accent);transform:scale(1.05)}
.song-card-mini{display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:rgba(255,255,255,0.08);border-radius:10px;cursor:pointer;
  margin-top:4px;transition:all 0.2s}
.song-card-mini:hover{background:rgba(255,255,255,0.15);transform:scale(1.02)}
.song-card-mini:active{transform:scale(0.98)}
.song-card-mini-icon{font-size:20px;flex-shrink:0}
.song-card-mini-info{flex:1;min-width:0}
.song-card-mini-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-card-mini-artist{font-size:11px;opacity:0.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-card-mini-play{width:28px;height:28px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:12px;
  color:#fff;flex-shrink:0;transition:transform 0.2s}
.song-card-mini:hover .song-card-mini-play{transform:scale(1.1)}
@keyframes msgIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}

.chat-input-area{display:flex;gap:8px;padding:10px 0}
.chat-input-area .input-field{flex:1;padding:10px 14px;font-size:13px}
.chat-send{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:16px}
.chat-send:hover{transform:scale(1.1)}

/* ============ EXIT POPUP ============ */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);z-index:2000;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex;animation:fadeIn .25s ease}
.exit-popup{background:var(--card);border:1px solid var(--glass-border);border-radius:20px;
  padding:32px;text-align:center;max-width:320px;width:90%;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
.exit-popup .emoji{font-size:48px;margin-bottom:12px}
.exit-popup .msg{font-size:16px;font-weight:600;color:var(--text);margin-bottom:20px}
.exit-popup .btns{display:flex;gap:12px;justify-content:center}
.exit-popup .btns .btn{flex:1;font-size:13px;padding:10px 16px}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:2px}

/* ============ RESPONSIVE ============ */
@media(max-width:480px){
  .join-title{font-size:32px}
  .vinyl{width:150px;height:150px}
  .vinyl-label{width:45px;height:45px}
  .cat-head{width:75px;height:62px}

<script>
// ============ STATE ============
let state = {
  theme: 'cat',
  sessionId: null,
  isHost: false,
  playing: false,
  catMood: 0,
  avatarPickerTarget: null,
  pollTimer: null
};

// ============ THEME ============
function toggleThemeMenu(){
  document.getElementById('themePopup').classList.toggle('show');
}
function setTheme(t){
  state.theme = t;
  document.body.className = 'theme-'+t;
  document.getElementById('themePopup').classList.remove('show');
  buildBgLayer();
  // 新猫猫始终显示，不需要切换
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.theme-btn') && !e.target.closest('.theme-popup'))
    document.getElementById('themePopup').classList.remove('show');
  if(!e.target.closest('.avatar'))
    document.querySelectorAll('.avatar-menu').forEach(m=>m.classList.remove('show'));
});

// ============ BG LAYER BUILDER ============
function buildBgLayer(){
  const layer = document.getElementById('bgLayer');
  layer.innerHTML = '';
  const t = state.theme;

  if(t==='sakura'){
    // Stars
    for(let i=0;i<35;i++){
      const s = document.createElement('div');
      s.className='star';
      const size = Math.random()>.7?2:1;
      s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s`;
      layer.appendChild(s);
    }
    // Petals
    for(let i=0;i<22;i++){
      const p = document.createElement('div');
      p.className='sakura-petal';
      const sz = 8+Math.random()*10;
      p.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz*.7}px;--d:${8+Math.random()*7}s;--delay:${Math.random()*10}s`;
      layer.appendChild(p);
    }
    // Aurora
    const a = document.createElement('div');
    a.className='aurora';
    layer.appendChild(a);
  }
  else if(t==='ocean'){
    // Bubbles
    for(let i=0;i<18;i++){
      const b = document.createElement('div');
      b.className='bubble';
      const sz = 8+Math.random()*18;
      b.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;--d:${8+Math.random()*7}s;--delay:${Math.random()*10}s`;
      layer.appendChild(b);
    }
    // Jellyfish
    for(let i=0;i<3;i++){
      const j = document.createElement('div');
      j.className='jellyfish';
      j.style.cssText=`left:${15+i*30}%;top:${25+i*15}%;--d:${5+Math.random()*3}s`;
      let html='<div class="jelly-bell">';
      for(let k=0;k<5;k++) html+=`<div class="jelly-tentacle" style="left:${8+k*10}px"></div>`;
      html+='</div>';
      j.innerHTML=html;
      layer.appendChild(j);
    }
    // Caustic
    const c = document.createElement('div');
    c.className='caustic';
    layer.appendChild(c);
  }
  else if(t==='mint'){
    const colors = ['#ffb7c5','#c4b5fd','#93c5fd','#fde68a','#a7f3d0'];
    for(let i=0;i<18;i++){
      const c = document.createElement('div');
      const type = ['','circle','triangle'][Math.floor(Math.random()*3)];
      c.className='confetti '+type;
      const sz = 8+Math.random()*12;
      const col = colors[Math.floor(Math.random()*colors.length)];
      c.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${col};--d:${8+Math.random()*4}s;--delay:${Math.random()*8}s;--c:${col}`;
      layer.appendChild(c);
    }
  }
  else if(t==='cat'){
    // Paw prints
    for(let i=0;i<10;i++){
      const p = document.createElement('div');
      p.className='paw-print';
      p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;transform:rotate(${Math.random()*360}deg)`;
      layer.appendChild(p);
    }
  }
}

// ============ CODE INPUTS ============
// (已改为单行输入框，旧的6位数字逻辑已移除)

function getCode(){
  return document.getElementById('roomCodeInput').value.trim();
}

// ============ API ============
async function api(path,body){
  try{
    const r = await fetch('/api/listen/'+path,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    return await r.json();
  }catch(e){return {ok:false,error:e.message}}
}

async function createRoom(){
  const name = document.getElementById('nameInput').value.trim()||'匿名';
  const r = await api('create',{host_name:name});
  if(r && r.ok){
    state.sessionId = r.session_id;
    state.isHost = true;
    showMain();
  }
}

async function joinRoom(){
  const code = getCode();
  if(!code){alert('请输入房间码');return}
  const name = document.getElementById('nameInput').value.trim()||'匿名';
  const r = await api('join',{session_id:code,guest_name:name});
  if(r && r.ok){
    state.sessionId = code;
    state.isHost = false;
    showMain();
  }else{
    alert('加入失败，请检查房间码');
  }
}

function showMain(){
  document.getElementById('joinPage').style.display='none';
  document.getElementById('mainPage').style.display='flex';
  document.getElementById('roomCodeDisplay').textContent=state.sessionId||'------';
  startPolling();
}

function copyRoomCode(){
  if(navigator.clipboard){
    navigator.clipboard.writeText(state.sessionId||'');
  }
  const btn=document.querySelector('.copy-btn');
  btn.textContent='✓';
  setTimeout(()=>btn.textContent='📋',1500);
}

// ============ POLLING ============
function startPolling(){
  if(state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(pollStatus, 3000);
}

function playSongFromComment(id, name, artist) {
  const audio = document.getElementById('listenAudio');
  audio.src = '/api/proxy_play?id=' + id;
  audio.play().catch(e => {});
  const sn = document.getElementById('songName');
  const sa = document.getElementById('songArtist');
  if(sn) sn.textContent = name;
  if(sa) sa.textContent = artist;
  
  // 更新播放状态
  state.playing = true;
  document.getElementById('vinyl').classList.add('spinning');
  document.getElementById('tonearmArm').classList.add('playing');
  document.getElementById('playIcon').className = 'icon-pause';
  
  // 加载歌词
  currentSongId = String(id);
  if(lyricsVisible) loadLyrics(currentSongId);
  
  showToast('🎵 正在播放: ' + name);
}

// ============ SONG SEARCH ============
let listenSongs = [];
fetch('/songs_data.js').then(r=>r.text()).then(t=>{
  try{const s=t.indexOf('['),e=t.lastIndexOf(']');if(s>=0&&e>s) listenSongs=JSON.parse(t.substring(s,e+1));}catch(e){}
}).catch(()=>{});

let songSearchTimer = null;
function searchListenSongs(q) {
  clearTimeout(songSearchTimer);
  const results = document.getElementById('songResults');
  if(!q.trim()){results.style.display='none';return;}
  songSearchTimer = setTimeout(()=>{
    const ql = q.toLowerCase().trim();
    const matched = listenSongs.filter(s=> (s.n||'').toLowerCase().includes(ql) || (s.a||'').toLowerCase().includes(ql)).slice(0,8);
    if(!matched.length){results.style.display='none';return;}
    results.innerHTML = matched.map(s=>
      '<div class="song-result-item" onclick="selectListenSong('+s.i+',this)" data-name="'+(s.n||'').replace(/"/g,'&quot;')+'" data-artist="'+(s.a||'').replace(/"/g,'&quot;')+'">' +
      '<div><div style="font-weight:600">'+s.n+'</div><div style="font-size:11px;opacity:0.6">'+s.a+'</div></div></div>'
    ).join('');
    results.style.display='';
  },200);
}

function selectListenSong(id, el) {
  document.getElementById('songResults').style.display='none';
  document.getElementById('songSearch').value='';
  const name = el.dataset.name;
  const artist = el.dataset.artist;
  
  // Play the song
  const audio = document.getElementById('listenAudio');
  audio.src = '/api/proxy_play?id=' + id;
  audio.play().catch(e => {});
  
  // Update UI
  const sn = document.getElementById('songName');
  const sa = document.getElementById('songArtist');
  if(sn) sn.textContent = name;
  if(sa) sa.textContent = artist;
  
  // 更新播放状态
  state.playing = true;
  document.getElementById('vinyl').classList.add('spinning');
  document.getElementById('tonearmArm').classList.add('playing');
  document.getElementById('playIcon').className = 'icon-pause';
  
  // 加载歌词
  currentSongId = String(id);
  if(lyricsVisible) loadLyrics(currentSongId);
  
  if(!state.sessionId) return;
  const from = document.getElementById('nameInput').value.trim()||'匿名';
  
  // Save song info to server
  fetch('/api/listen/song',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      session_id:state.sessionId,
      song_id:String(id),
      song_name:name,
      song_artist:artist,
      changed_by:from
    })
  });
  
  showToast('🎵 正在播放: '+name);
}

document.addEventListener('click',e=>{
  const sr = document.getElementById('songResults');
  if(sr && !e.target.closest('#songSearch') && !e.target.closest('#songResults')) sr.style.display='none';
});

// ============ CHAT ============
async function sendChat(){
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if(!text || !state.sessionId) return;
  inp.value='';
  const from = document.getElementById('nameInput').value.trim()||'匿名';
  await api('chat',{session_id:state.sessionId,from,text});
  pollStatus();
}

async function pollStatus(){
  if(!state.sessionId) return;
  try{
    const r = await fetch('/api/listen/status?id='+state.sessionId);
    const d = await r.json();
    if(d && d.ok && d.session){
      const s = d.session;
      // 更新在线状态
      const hostEl = document.getElementById('hostStatus');
      const guestEl = document.getElementById('guestStatus');
      if(hostEl && s.host){hostEl.textContent='👤 主人: '+s.host;hostEl.style.opacity='1';}
      if(guestEl && s.guest){guestEl.textContent='👤 伙伴: '+s.guest;guestEl.style.opacity='1';}
      if(guestEl && !s.guest){guestEl.textContent='👤 伙伴: 等待加入...';guestEl.style.opacity='0.5';}
      
      if(s.song){
        document.getElementById('songName').textContent = s.song.name||'未知歌曲';
        document.getElementById('songArtist').textContent = s.song.artist||'未知歌手';
      }
      if(s.messages){
        const box = document.getElementById('chatMessages');
        box.innerHTML='';
        s.messages.forEach(m=>{
          const isSelf = m.from===(state.isHost?'host':'guest');
          if(m.from==='系统'){
            const div=document.createElement('div');
            div.className='chat-msg system';
            div.style.cssText='align-self:center;font-size:11px;opacity:0.5;padding:4px 12px';
            div.textContent=m.text;
            box.appendChild(div);
          } else {
            const div=document.createElement('div');
            div.className='chat-msg '+(isSelf?'self':'other');
            let html='<div class="msg-from">'+escHtml(m.from)+'</div>';
            if(m.text) html+='<div>'+escHtml(m.text)+'</div>';
            if(m.song_id){
              html+='<div class="song-card-mini" onclick="playSongFromComment(\''+m.song_id+'\',\''+escHtml(m.song_name||'')+'\',\''+escHtml(m.song_artist||'')+'\')">'+
                '<div class="song-card-mini-icon">🎵</div>'+
                '<div class="song-card-mini-info"><div class="song-card-mini-name">'+escHtml(m.song_name||'未知')+'</div>'+
                '<div class="song-card-mini-artist">'+escHtml(m.song_artist||'')+'</div></div>'+
                '<div class="song-card-mini-play">▶</div></div>';
            }
            div.innerHTML=html;
            box.appendChild(div);
          }
        });
        box.scrollTop=box.scrollHeight;
      }
    }
  }catch(e){}
}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  const audio = document.getElementById('listenAudio');
  const bar=document.getElementById('progressBar');
  const pct=e.offsetX/bar.offsetWidth*100;
  document.getElementById('progressFill').style.width=pct+'%';

// 进度条自动更新
const _listenAudio = document.getElementById('listenAudio');
_listenAudio.addEventListener('timeupdate', function(){
  if(!_listenAudio.duration) return;
  const pct = _listenAudio.currentTime / _listenAudio.duration * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('timeElapsed').textContent = formatTime(_listenAudio.currentTime);
  document.getElementById('timeTotal').textContent = formatTime(_listenAudio.duration);
});
_listenAudio.addEventListener('ended', function(){
  state.playing = false;
  document.getElementById('vinyl').classList.remove('spinning');
  document.getElementById('tonearmArm').classList.remove('playing');
  document.getElementById('playIcon').className='icon-play';
});
function formatTime(s){const m=Math.floor(s/60);const sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}

// 歌词系统
let lyricsVisible = false;
let currentLyrics = [];
function toggleLyrics(){
  lyricsVisible = !lyricsVisible;
  const panel = document.getElementById('lyricsPanel');
  if(panel) panel.style.display = lyricsVisible ? 'flex' : 'none';
  if(lyricsVisible && currentSongId) loadLyrics(currentSongId);
}
let currentSongId = null;
async function loadLyrics(songId){
  currentSongId = songId;
  const panel = document.getElementById('lyricsPanel');
  if(!panel) return;
  const content = panel.querySelector('.lyrics-content');
  if(!content) return;
  content.innerHTML = '<div style="text-align:center;opacity:0.5;padding:20px">加载歌词中...</div>';
  try{
    const r = await fetch('/api/lyric?id=' + songId);
    const d = await r.json();
    if(d.lyric){
      currentLyrics = parseLRC(d.lyric);
      renderLyrics(content);
    }else{
      content.innerHTML = '<div style="text-align:center;opacity:0.5;padding:20px">暂无歌词</div>';
    }
  }catch(e){
    content.innerHTML = '<div style="text-align:center;opacity:0.5;padding:20px">歌词加载失败</div>';
  }
}
function parseLRC(lrc){
  const lines = lrc.split('\n');
  const result = [];
  for(const line of lines){
    const m = line.match(/\[(\d+):(\d+)\.(\d+)\](.*)/);
    if(m){
      const time = parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/100;
      result.push({time, text: m[4].trim()});
    }
  }
  return result.sort((a,b)=>a.time-b.time);
}
function renderLyrics(container){
  container.innerHTML = '';
  if(currentLyrics.length===0){
    container.innerHTML = '<div style="text-align:center;opacity:0.5;padding:20px">暂无歌词</div>';
    return;
  }
  for(let i=0;i<currentLyrics.length;i++){
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.textContent = currentLyrics[i].text || '...';
    div.dataset.time = currentLyrics[i].time;
    container.appendChild(div);
  }
}
// 歌词随歌滚动（只在歌词面板内滚动，不带动整个页面）
let _lastLyricIdx = -1;
_listenAudio.addEventListener('timeupdate', function(){
  if(!lyricsVisible || currentLyrics.length===0) return;
  const ct = _listenAudio.currentTime;
  let activeIdx = -1;
  for(let i=currentLyrics.length-1;i>=0;i--){
    if(ct >= currentLyrics[i].time){activeIdx=i;break;}
  }
  if(activeIdx === _lastLyricIdx) return;
  _lastLyricIdx = activeIdx;
  const lines = document.querySelectorAll('.lyric-line');
  lines.forEach((el,i)=>{
    if(i===activeIdx){
      el.classList.add('active');
      // 只在歌词面板内滚动，不影响页面
      const container = el.parentElement;
      if(container){
        const elTop = el.offsetTop;
        const elH = el.offsetHeight;
        const contH = container.clientHeight;
        container.scrollTo({top: elTop - contH/2 + elH/2, behavior: 'smooth'});
      }
    }else{
      el.classList.remove('active');
    }
  });
});

async function pickPhoto(n,file){
  if(!file)return;
  document.querySelectorAll('.avatar-menu').forEach(m=>m.classList.remove('show'));
  const fd=new FormData();fd.append('file',file);
  try{
    const r=await fetch('/api/listen/upload_image',{method:'POST',body:fd});
    const d=await r.json();
    if(d.ok){
      const avatar=document.getElementById('avatar'+n);
      avatar.style.backgroundImage='url('+d.url+')';
      avatar.style.backgroundSize='cover';
      avatar.style.backgroundPosition='center';
      avatar.firstChild.style.display='none';
    }
  }catch(e){alert('上传失败');}
  // 清除input值，允许重复选择同一文件
  document.getElementById('photoInput'+n).value='';
}
