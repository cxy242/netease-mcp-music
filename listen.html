<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🎧 一起听 - 月汐音乐花园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ====== THEME VARIABLES ====== */
:root {
  --bg1:#0a0e27; --bg2:#1a1a4e; --bg3:#0d1b3e;
  --text:#eee; --text2:rgba(255,255,255,0.7); --text3:rgba(255,255,255,0.4);
  --accent:#e91e63; --accent2:#ff5722; --glass:rgba(255,255,255,0.08);
  --glass-border:rgba(255,255,255,0.15); --shadow:rgba(0,0,0,0.3);
}

/* Theme: Pixel Cat */
[data-theme="cat"] {
  --bg1:#0d0d0d; --bg2:#1a1a2e; --bg3:#16213e;
  --text:#e0e0e0; --text2:rgba(224,224,224,0.7); --text3:rgba(224,224,224,0.4);
  --accent:#ff1744; --accent2:#d50000; --glass:rgba(255,23,68,0.08);
  --glass-border:rgba(255,23,68,0.2); --shadow:rgba(255,23,68,0.1);
}

/* Theme: Sakura */
[data-theme="sakura"] {
  --bg1:#1a0a2e; --bg2:#2d1b4e; --bg3:#3d1a5e;
  --text:#fce4ec; --text2:rgba(252,228,236,0.7); --text3:rgba(252,228,236,0.4);
  --accent:#f48fb1; --accent2:#ce93d8; --glass:rgba(244,143,177,0.1);
  --glass-border:rgba(244,143,177,0.2); --shadow:rgba(244,143,177,0.15);
}

/* Theme: Ocean */
[data-theme="ocean"] {
  --bg1:#020c1b; --bg2:#0a192f; --bg3:#0d2137;
  --text:#ccd6f6; --text2:rgba(204,214,246,0.7); --text3:rgba(204,214,246,0.4);
  --accent:#64ffda; --accent2:#00bcd4; --glass:rgba(100,255,218,0.06);
  --glass-border:rgba(100,255,218,0.15); --shadow:rgba(100,255,218,0.1);
}

/* Theme: Mint */
[data-theme="mint"] {
  --bg1:#f0fdf4; --bg2:#ecfdf5; --bg3:#d1fae5;
  --text:#064e3b; --text2:rgba(6,78,59,0.7); --text3:rgba(6,78,59,0.4);
  --accent:#10b981; --accent2:#34d399; --glass:rgba(16,185,129,0.1);
  --glass-border:rgba(16,185,129,0.2); --shadow:rgba(16,185,129,0.1);
}

body {
  min-height:100vh; font-family:-apple-system,system-ui,sans-serif; overflow-x:hidden;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  color:var(--text); transition:background 0.5s, color 0.5s;
}

/* ====== THEME PICKER ====== */
.theme-picker {
  position:fixed; top:12px; right:12px; z-index:999;
  display:flex; gap:6px; background:var(--glass); backdrop-filter:blur(20px);
  border:1px solid var(--glass-border); border-radius:16px; padding:6px;
}
.theme-btn {
  width:32px; height:32px; border-radius:10px; border:2px solid transparent;
  cursor:pointer; transition:all 0.3s; font-size:14px; display:flex; align-items:center; justify-content:center;
}
.theme-btn.active { border-color:var(--accent); transform:scale(1.15); box-shadow:0 0 12px var(--shadow); }
.theme-btn:hover { transform:scale(1.1); }

/* ====== BACK LINK ====== */
.back-link {
  position:fixed; top:14px; left:16px; color:var(--text2); text-decoration:none;
  font-size:0.85em; z-index:999; background:var(--glass); backdrop-filter:blur(10px);
  padding:6px 12px; border-radius:10px; border:1px solid var(--glass-border);
}
.back-link:hover { color:var(--accent); }

/* ====== JOIN PAGE ====== */
.join-page {
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:30px; text-align:center;
}
.join-icon { font-size:4em; margin-bottom:16px; animation:float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.join-title {
  font-size:2em; font-weight:800; margin-bottom:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.join-desc { color:var(--text2); margin-bottom:30px; font-size:0.95em; }
.join-input {
  width:85%; max-width:320px; padding:14px; border-radius:16px;
  border:2px solid var(--glass-border); background:var(--glass); color:var(--text);
  font-size:1em; text-align:center; outline:none; backdrop-filter:blur(10px); margin-bottom:12px;
  transition:border-color 0.3s;
}
.join-input:focus { border-color:var(--accent); }
.join-input::placeholder { color:var(--text3); }
.join-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
.join-btn {
  padding:14px 28px; border-radius:16px; border:none; font-size:1em; font-weight:700;
  cursor:pointer; transition:all 0.3s; color:#fff;
}
.join-btn:hover { transform:translateY(-2px); filter:brightness(1.1); }
.join-btn.create { background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 4px 16px var(--shadow); }
.join-btn.join { background:linear-gradient(135deg,#667eea,#764ba2); box-shadow:0 4px 16px rgba(102,126,234,0.3); }

/* Join by code */
.join-code-section {
  margin-top:16px; padding:16px; background:var(--glass); border:1px solid var(--glass-border);
  border-radius:16px; width:85%; max-width:320px; backdrop-filter:blur(10px);
}
.join-code-title { font-size:0.85em; color:var(--text2); margin-bottom:10px; }
.join-code-inputs { display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
.code-input {
  width:36px; height:44px; border-radius:10px; border:2px solid var(--glass-border);
  background:var(--glass); color:var(--text); font-size:1.2em; font-weight:700;
  text-align:center; outline:none; transition:border-color 0.3s;
}
.code-input:focus { border-color:var(--accent); }
.join-code-btn {
  padding:10px 20px; border:none; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; font-weight:600; cursor:pointer; font-size:0.9em;
}

/* ====== MAIN PAGE ====== */
.main-page { display:none; padding-bottom:80px; }

/* Room Code Bar */
.room-code-bar {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 16px; margin:16px; background:var(--glass); border:1px solid var(--glass-border);
  border-radius:14px; backdrop-filter:blur(10px);
}
.room-code-label { font-size:0.8em; color:var(--text2); }
.room-code-value {
  font-size:1.1em; font-weight:800; letter-spacing:3px; color:var(--accent);
  font-family:monospace;
}
.copy-btn {
  padding:4px 10px; border:none; border-radius:8px; background:var(--accent);
  color:#fff; font-size:0.75em; cursor:pointer; font-weight:600;
}

/* Avatars */
.avatar-section { padding:24px 20px 8px; text-align:center; }
.avatar-container { display:flex; align-items:center; justify-content:center; gap:0; }
.avatar-wrap { text-align:center; cursor:pointer; }
.avatar {
  width:72px; height:72px; border-radius:50%; border:3px solid var(--glass-border);
  overflow:hidden; position:relative; transition:border-color 0.3s;
}
.avatar:hover { border-color:var(--accent); }
.avatar .placeholder {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-size:2em; background:linear-gradient(135deg,#667eea,#764ba2);
}
.avatar img { width:100%; height:100%; object-fit:cover; }
.avatar-name { font-size:0.75em; color:var(--text2); margin-top:6px; }

.connection { display:flex; flex-direction:column; align-items:center; margin:0 -8px; }
.headphone-icon { font-size:2em; filter:drop-shadow(0 0 8px var(--shadow)); }
.headphone-line { width:60px; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent)); margin:2px 0; border-radius:1px; }
.heart-beat { animation:heartbeat 1.5s ease-in-out infinite; font-size:1em; margin:2px 0; }
@keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

/* Song Info */
.song-info { text-align:center; padding:12px 20px; }
.song-name { font-size:1.3em; font-weight:700; margin-bottom:4px; text-shadow:0 2px 8px var(--shadow); }
.song-artist { color:var(--text2); font-size:0.85em; }

/* Record Player */
.record-player { display:flex; justify-content:center; padding:16px 0; }
.record {
  width:160px; height:160px; border-radius:50%;
  background:conic-gradient(from 0deg,#1a1a2e,#2d2d4e,#1a1a2e,#2d2d4e,#1a1a2e);
  box-shadow:0 0 40px var(--shadow), inset 0 0 30px rgba(0,0,0,0.3);
  display:flex; align-items:center; justify-content:center;
  animation:spin 8s linear infinite; position:relative;
}
.record::before { content:''; position:absolute; width:140px; height:140px; border-radius:50%; background:conic-gradient(from 45deg,transparent,rgba(255,255,255,0.03),transparent,rgba(255,255,255,0.03),transparent); }
.record::after { content:''; position:absolute; width:50px; height:50px; border-radius:50%; background:radial-gradient(circle,var(--accent) 0%,var(--accent2) 50%,#880e4f 100%); border:3px solid #fff; box-shadow:0 0 12px var(--shadow); }
.record-center { position:absolute; font-size:1.2em; z-index:1; pointer-events:none; }
.record.paused { animation-play-state:paused; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* Progress */
.progress-section { padding:0 28px; display:flex; align-items:center; gap:8px; }
.progress-time { font-size:0.7em; color:var(--text3); min-width:32px; }
.progress-bar { flex:1; height:4px; background:rgba(255,255,255,0.15); border-radius:2px; cursor:pointer; position:relative; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:2px; width:0%; transition:width 1s linear; position:relative; }
.progress-fill::after { content:''; position:absolute; right:-4px; top:-3px; width:10px; height:10px; border-radius:50%; background:#fff; box-shadow:0 0 6px var(--shadow); }

/* Controls */
.controls { display:flex; align-items:center; justify-content:center; gap:28px; padding:12px 0; }
.ctrl-btn { background:none; border:none; color:var(--text2); font-size:1.4em; cursor:pointer; transition:all 0.2s; padding:8px; }
.ctrl-btn:hover { color:var(--text); transform:scale(1.15); }
.ctrl-btn.play {
  width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; font-size:1.6em; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 20px var(--shadow);
}

/* Chat */
.chat-section { padding:0 16px; margin-top:8px; }
.chat-box {
  background:var(--glass); border:1px solid var(--glass-border); border-radius:16px;
  max-height:160px; overflow-y:auto; padding:12px; backdrop-filter:blur(10px);
}
.chat-msg { margin-bottom:8px; font-size:0.85em; display:flex; gap:6px; align-items:flex-start; }
.chat-avatar { width:24px; height:24px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.6em; }
.chat-content { flex:1; }
.chat-name { font-weight:600; font-size:0.8em; margin-bottom:1px; }
.chat-name.me { color:#87CEEB; }
.chat-name.ai { color:var(--accent); }
.chat-name.system { color:var(--text3); font-size:0.75em; }
.chat-text { color:var(--text2); line-height:1.4; }
.chat-time { color:var(--text3); font-size:0.65em; margin-top:2px; }

.input-section { padding:10px 16px 20px; display:flex; gap:8px; }
.chat-input {
  flex:1; padding:10px 16px; border-radius:24px; border:1px solid var(--glass-border);
  background:var(--glass); color:var(--text); font-size:0.9em; outline:none;
  backdrop-filter:blur(10px); transition:border-color 0.3s;
}
.chat-input:focus { border-color:var(--accent); }
.chat-input::placeholder { color:var(--text3); }
.send-btn {
  padding:10px 18px; border-radius:24px; border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; font-weight:600; cursor:pointer; font-size:0.9em;
}

/* ====== PIXEL CAT THEME EXTRAS ====== */
[data-theme="cat"] body::before {
  content:''; position:fixed; top:0; left:0; right:0; bottom:0;
  background-image:
    linear-gradient(rgba(255,23,68,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,23,68,0.03) 1px, transparent 1px);
  background-size:20px 20px; pointer-events:none; z-index:0;
}

/* Pixel Cat Pet */
.cat-pet {
  position:fixed; bottom:20px; right:20px; z-index:998;
  width:80px; height:80px; image-rendering:pixelated;
  cursor:pointer; transition:transform 0.3s;
}
.cat-pet:hover { transform:scale(1.1); }
.cat-pet.bounce { animation:catBounce 0.5s ease; }
@keyframes catBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

/* Cat body using box-shadow pixel art */
.cat-body {
  position:absolute; width:4px; height:4px; left:38px; top:38px;
  background:transparent;
  box-shadow:
    /* Left ear */
    4px -16px 0 #111, 8px -16px 0 #111,
    0px -12px 0 #111, 4px -12px 0 #222, 8px -12px 0 #222, 12px -12px 0 #111,
    /* Inner ear (pink) */
    4px -8px 0 #ff69b4, 8px -8px 0 #ff69b4,
    /* Head top */
    -4px -8px 0 #111, 0px -8px 0 #1a1a1a, 4px -8px 0 #1a1a1a, 8px -8px 0 #1a1a1a, 12px -8px 0 #1a1a1a, 16px -8px 0 #111,
    /* Head with eyes */
    -8px -4px 0 #111, -4px -4px 0 #1a1a1a, 0px -4px 0 #1a1a1a, 4px -4px 0 #ff1744, 8px -4px 0 #1a1a1a, 12px -4px 0 #ff1744, 16px -4px 0 #1a1a1a, 20px -4px 0 #111,
    /* Nose and mouth */
    -8px 0px 0 #111, -4px 0px 0 #1a1a1a, 0px 0px 0 #1a1a1a, 4px 0px 0 #1a1a1a, 8px 0px 0 #ff69b4, 12px 0px 0 #1a1a1a, 16px 0px 0 #1a1a1a, 20px 0px 0 #111,
    /* Whiskers */
    -16px 0px 0 #555, -12px 0px 0 #555, 24px 0px 0 #555, 28px 0px 0 #555,
    -16px 4px 0 #555, 28px 4px 0 #555,
    /* Body */
    -4px 4px 0 #111, 0px 4px 0 #1a1a1a, 4px 4px 0 #1a1a1a, 8px 4px 0 #1a1a1a, 12px 4px 0 #1a1a1a, 16px 4px 0 #111,
    -8px 8px 0 #111, -4px 8px 0 #1a1a1a, 0px 8px 0 #222, 4px 8px 0 #222, 8px 8px 0 #222, 12px 8px 0 #222, 16px 8px 0 #1a1a1a, 20px 8px 0 #111,
    -8px 12px 0 #111, -4px 12px 0 #1a1a1a, 0px 12px 0 #222, 4px 12px 0 #222, 8px 12px 0 #222, 12px 12px 0 #222, 16px 12px 0 #1a1a1a, 20px 12px 0 #111,
    -4px 16px 0 #111, 0px 16px 0 #1a1a1a, 4px 16px 0 #1a1a1a, 8px 16px 0 #1a1a1a, 12px 16px 0 #1a1a1a, 16px 16px 0 #111,
    /* Front paws */
    -4px 20px 0 #111, 0px 20px 0 #222, 12px 20px 0 #222, 16px 20px 0 #111,
    -4px 24px 0 #333, 0px 24px 0 #333, 12px 24px 0 #333, 16px 24px 0 #333;
}

/* Cat tail */
.cat-tail {
  position:absolute; right:-12px; top:40px; width:4px; height:4px;
  background:transparent; animation:tailWag 1.5s ease-in-out infinite;
  box-shadow:
    0px 0px 0 #111, 4px -4px 0 #1a1a1a, 8px -8px 0 #1a1a1a,
    12px -12px 0 #1a1a1a, 16px -16px 0 #1a1a1a, 20px -20px 0 #111,
    20px -16px 0 #111;
}
@keyframes tailWag { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(15deg)} }

/* Cat blink */
.cat-eyes {
  position:absolute; left:0; top:0; width:80px; height:80px; pointer-events:none;
}
.cat-eyes::before, .cat-eyes::after {
  content:''; position:absolute; width:4px; height:4px; border-radius:0;
  background:#ff1744; box-shadow:0 0 4px #ff1744, 0 0 8px rgba(255,23,68,0.5);
  animation:catBlink 4s ease-in-out infinite;
}
.cat-eyes::before { left:38px; top:26px; }
.cat-eyes::after { left:50px; top:26px; animation-delay:0.1s; }
@keyframes catBlink {
  0%,42%,46%,100% { height:4px; opacity:1; }
  44% { height:0px; opacity:0; }
}

/* ====== SAKURA THEME EXTRAS ====== */
.sakura-petal {
  position:fixed; top:-20px; z-index:1; pointer-events:none;
  width:12px; height:12px; background:radial-gradient(circle,#ffb7c5 30%,#ff69b4 100%);
  border-radius:50% 0 50% 50%; opacity:0.7;
  animation:sakuraFall linear infinite;
}
@keyframes sakuraFall {
  0% { transform:translateY(-20px) rotate(0deg) translateX(0); opacity:0.8; }
  100% { transform:translateY(100vh) rotate(720deg) translateX(100px); opacity:0; }
}

/* ====== OCEAN THEME EXTRAS ====== */
.bubble {
  position:fixed; bottom:-20px; z-index:1; pointer-events:none;
  border-radius:50%; border:1px solid rgba(100,255,218,0.3);
  background:radial-gradient(circle at 30% 30%, rgba(100,255,218,0.15), transparent);
  animation:bubbleRise linear infinite;
}
@keyframes bubbleRise {
  0% { transform:translateY(0) translateX(0); opacity:0.6; }
  100% { transform:translateY(-100vh) translateX(30px); opacity:0; }
}
.jellyfish {
  position:fixed; z-index:1; pointer-events:none; opacity:0.3;
  font-size:2em; animation:jellyfishFloat 8s ease-in-out infinite;
}
@keyframes jellyfishFloat {
  0%,100% { transform:translateY(0) translateX(0); }
  25% { transform:translateY(-30px) translateX(20px); }
  50% { transform:translateY(-10px) translateX(-15px); }
  75% { transform:translateY(-40px) translateX(10px); }
}

/* ====== MINT THEME EXTRAS ====== */
[data-theme="mint"] .back-link,
[data-theme="mint"] .join-input,
[data-theme="mint"] .chat-input {
  background:rgba(16,185,129,0.08);
}
.candy-orb {
  position:fixed; border-radius:50%; pointer-events:none; z-index:1;
  animation:candyFloat 6s ease-in-out infinite;
}
@keyframes candyFloat {
  0%,100% { transform:translateY(0) scale(1); }
  50% { transform:translateY(-20px) scale(1.1); }
}

/* ====== RESPONSIVE ====== */
@media(max-width:400px) {
  .theme-picker { top:6px; right:6px; padding:4px; }
  .theme-btn { width:28px; height:28px; font-size:12px; }
  .avatar { width:60px; height:60px; }
  .record { width:130px; height:130px; }
  .cat-pet { width:60px; height:60px; bottom:10px; right:10px; }
}
</style>
</head>
<body>

<!-- Theme Picker -->
<div class="theme-picker">
  <button class="theme-btn active" onclick="setTheme('default')" title="默认">🌙</button>
  <button class="theme-btn" onclick="setTheme('cat')" title="像素黑猫">🐱</button>
  <button class="theme-btn" onclick="setTheme('sakura')" title="星空樱花">🌸</button>
  <button class="theme-btn" onclick="setTheme('ocean')" title="深海珊瑚">🌊</button>
  <button class="theme-btn" onclick="setTheme('mint')" title="薄荷糖果">🍬</button>
</div>

<!-- ====== JOIN PAGE ====== -->
<div id="join-page" class="join-page">
  <div class="join-icon">🎧</div>
  <div class="join-title">一起听</div>
  <div class="join-desc">和重要的人，听同一首歌</div>
  <input id="join-name" class="join-input" placeholder="输入你的名字">
  <div class="join-btns">
    <button class="join-btn create" onclick="createRoom()">🏠 创建房间</button>
    <button class="join-btn join" onclick="joinRoomByCode()">💕 加入房间</button>
  </div>
  <!-- Join by room code -->
  <div class="join-code-section">
    <div class="join-code-title">🔑 输入房间码加入</div>
    <div class="join-code-inputs">
      <input class="code-input" maxlength="1" oninput="codeInputNext(this,1)" onkeydown="codeInputKey(event,0)">
      <input class="code-input" maxlength="1" oninput="codeInputNext(this,2)" onkeydown="codeInputKey(event,1)">
      <input class="code-input" maxlength="1" oninput="codeInputNext(this,3)" onkeydown="codeInputKey(event,2)">
      <input class="code-input" maxlength="1" oninput="codeInputNext(this,4)" onkeydown="codeInputKey(event,3)">
      <input class="code-input" maxlength="1" oninput="codeInputNext(this,5)" onkeydown="codeInputKey(event,4)">
      <input class="code-input" maxlength="1" oninput="codeInputNext(this,6)" onkeydown="codeInputKey(event,5)">
    </div>
    <button class="join-code-btn" onclick="joinByCode()">加入房间</button>
  </div>
</div>

<!-- ====== MAIN PAGE ====== -->
<div id="main-page" class="main-page">
  <a href="/" class="back-link">← 返回花园</a>

  <!-- Room Code -->
  <div class="room-code-bar">
    <span class="room-code-label">房间码</span>
    <span class="room-code-value" id="room-code">------</span>
    <button class="copy-btn" onclick="copyRoomCode()">复制</button>
  </div>

  <!-- Avatars -->
  <div class="avatar-section">
    <div class="avatar-container">
      <div class="avatar-wrap" onclick="changeAvatar('host')">
        <div class="avatar" id="avatar-host">
          <div class="placeholder" id="avatar-host-img">💙</div>
        </div>
        <div class="avatar-name" id="avatar-host-name">-</div>
      </div>
      <div class="connection">
        <span class="headphone-icon">🎧</span>
        <div class="headphone-line"></div>
        <div class="heart-beat">💕</div>
        <div class="headphone-line"></div>
        <span class="headphone-icon">🎧</span>
      </div>
      <div class="avatar-wrap" onclick="changeAvatar('guest')">
        <div class="avatar" id="avatar-guest">
          <div class="placeholder" id="avatar-guest-img">💗</div>
        </div>
        <div class="avatar-name" id="avatar-guest-name">等待加入...</div>
      </div>
    </div>
  </div>

  <!-- Song Info -->
  <div class="song-info">
    <div class="song-name" id="song-name">等待播放...</div>
    <div class="song-artist" id="song-artist">-</div>
  </div>

  <!-- Record Player -->
  <div class="record-player">
    <div class="record paused" id="record">
      <span class="record-center">💿</span>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <span class="progress-time" id="time-current">0:00</span>
    <div class="progress-bar" id="progress-bar" onclick="seekTo(event)">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="progress-time" id="time-total">0:00</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" onclick="prevSong()">⏮</button>
    <button class="ctrl-btn play" id="play-btn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="nextSong()">⏭</button>
  </div>

  <!-- Chat -->
  <div class="chat-section">
    <div class="chat-box" id="chat-box"></div>
  </div>
  <div class="input-section">
    <input id="chat-msg" class="chat-input" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">发送</button>
  </div>
</div>

<!-- Pixel Cat Pet (only visible in cat theme) -->
<div class="cat-pet" id="catPet" style="display:none" onclick="catMeow()">
  <div class="cat-body"></div>
  <div class="cat-tail"></div>
  <div class="cat-eyes"></div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
// ====== THEME SYSTEM ======
let currentTheme = localStorage.getItem('listenTheme') || 'default';

function setTheme(theme) {
  currentTheme = theme;
  localStorage.setItem('listenTheme', theme);
  document.documentElement.setAttribute('data-theme', theme === 'default' ? '' : theme);

  // Update theme buttons
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  // Show/hide cat pet
  document.getElementById('catPet').style.display = theme === 'cat' ? '' : 'none';

  // Clean up theme effects
  document.querySelectorAll('.sakura-petal,.bubble,.jellyfish,.candy-orb').forEach(e => e.remove());

  // Add theme effects
  if(theme === 'sakura') initSakura();
  if(theme === 'ocean') initOcean();
  if(theme === 'mint') initMint();
}

// Apply saved theme
if(currentTheme !== 'default') {
  document.documentElement.setAttribute('data-theme', currentTheme);
  setTimeout(() => {
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.getAttribute('onclick').includes(currentTheme));
    });
    if(currentTheme === 'cat') document.getElementById('catPet').style.display = '';
    if(currentTheme === 'sakura') initSakura();
    if(currentTheme === 'ocean') initOcean();
    if(currentTheme === 'mint') initMint();
  }, 100);
}

// ====== THEME EFFECTS ======
function initSakura() {
  for(let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'sakura-petal';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (5 + Math.random() * 8) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.width = (8 + Math.random() * 8) + 'px';
    p.style.height = p.style.width;
    document.body.appendChild(p);
  }
}

function initOcean() {
  for(let i = 0; i < 15; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.left = Math.random() * 100 + '%';
    b.style.width = b.style.height = (6 + Math.random() * 16) + 'px';
    b.style.animationDuration = (6 + Math.random() * 10) + 's';
    b.style.animationDelay = Math.random() * 8 + 's';
    document.body.appendChild(b);
  }
  for(let i = 0; i < 3; i++) {
    const j = document.createElement('div');
    j.className = 'jellyfish';
    j.textContent = '🪼';
    j.style.left = (10 + Math.random() * 80) + '%';
    j.style.top = (20 + Math.random() * 60) + '%';
    j.style.animationDelay = Math.random() * 5 + 's';
    document.body.appendChild(j);
  }
}

function initMint() {
  const colors = ['#f472b6','#a78bfa','#60a5fa','#34d399','#fbbf24','#fb923c'];
  for(let i = 0; i < 8; i++) {
    const o = document.createElement('div');
    o.className = 'candy-orb';
    const size = 20 + Math.random() * 40;
    o.style.cssText = `left:${Math.random()*90}%;top:${Math.random()*90}%;width:${size}px;height:${size}px;background:radial-gradient(circle at 30% 30%,${colors[i%colors.length]}44,${colors[i%colors.length]}11);animation-delay:${Math.random()*4}s;animation-duration:${4+Math.random()*4}s`;
    document.body.appendChild(o);
  }
}

// ====== CAT PET ======
function catMeow() {
  const cat = document.getElementById('catPet');
  cat.classList.add('bounce');
  setTimeout(() => cat.classList.remove('bounce'), 500);
}

// Bounce cat when music plays
const catAudio = document.getElementById('audio');
catAudio.addEventListener('play', () => {
  if(currentTheme === 'cat') {
    const cat = document.getElementById('catPet');
    cat.classList.add('bounce');
    setTimeout(() => cat.classList.remove('bounce'), 500);
  }
});

// ====== ROOM CODE ======
let sessionId = '', myName = '';
const urlParams = new URLSearchParams(window.location.search);
sessionId = urlParams.get('id') || '';

function codeInputNext(el, nextIdx) {
  if(el.value && nextIdx < 6) {
    document.querySelectorAll('.code-input')[nextIdx].focus();
  }
}
function codeInputKey(e, idx) {
  if(e.key === 'Backspace' && !e.target.value && idx > 0) {
    document.querySelectorAll('.code-input')[idx-1].focus();
  }
}
function getCode() {
  return Array.from(document.querySelectorAll('.code-input')).map(i => i.value).join('');
}

function createRoom() {
  myName = document.getElementById('join-name').value.trim() || '月汐';
  fetch('/api/listen/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({host_name:myName})})
  .then(r => r.json()).then(d => {
    if(d.ok) {
      sessionId = d.session_id;
      history.replaceState(null, '', '?id=' + sessionId);
      showMain();
      startPolling();
    }
  });
}

function joinRoomByCode() {
  const code = getCode();
  if(code.length < 6) { alert('请输入6位房间码'); return; }
  myName = document.getElementById('join-name').value.trim() || '艾因';
  fetch('/api/listen/join', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session_id:code, guest_name:myName})})
  .then(r => r.json()).then(d => {
    if(d.ok) { sessionId = code; showMain(); startPolling(); }
    else alert(d.message || '加入失败');
  });
}

function joinByCode() { joinRoomByCode(); }

function copyRoomCode() {
  const code = document.getElementById('room-code').textContent;
  if(navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '已复制!';
      setTimeout(() => btn.textContent = '复制', 1500);
    });
  }
}

// ====== AVATAR ======
const avatarEmojis = ['💙','💗','🐱','🌸','🌊','🍬','🌙','⭐','🎀','💜','🦋','🎵','🎧','💫','🌈','❤️‍🔥'];
let avatarHostEmoji = '💙', avatarGuestEmoji = '💗';

function changeAvatar(who) {
  const emojis = avatarEmojis.map(e => `<button onclick="setAvatar('${who}','${e}')" style="font-size:1.5em;background:none;border:none;cursor:pointer;padding:4px">${e}</button>`).join('');
  const popup = document.createElement('div');
  popup.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--glass-border);border-radius:16px;padding:16px;z-index:9999;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;backdrop-filter:blur(20px)';
  popup.innerHTML = emojis + `<button onclick="this.parentElement.remove()" style="grid-column:span 4;padding:8px;border:none;border-radius:8px;background:var(--glass);color:var(--text);cursor:pointer">关闭</button>`;
  document.body.appendChild(popup);
}

function setAvatar(who, emoji) {
  if(who === 'host') { avatarHostEmoji = emoji; document.getElementById('avatar-host-img').textContent = emoji; }
  else { avatarGuestEmoji = emoji; document.getElementById('avatar-guest-img').textContent = emoji; }
  document.querySelectorAll('div[style*="position:fixed"][style*="z-index:9999"]').forEach(e => e.remove());
}

// ====== MAIN LOGIC ======
let isPlaying = false, pollTimer = null;
const audio = document.getElementById('audio');

function showMain() {
  document.getElementById('join-page').style.display = 'none';
  document.getElementById('main-page').style.display = 'block';
  document.getElementById('room-code').textContent = sessionId;
}

function startPolling() { pollTimer = setInterval(pollStatus, 2000); pollStatus(); }

function pollStatus() {
  if(!sessionId) return;
  fetch('/api/listen/status?id=' + sessionId).then(r => r.json()).then(d => {
    if(!d.ok) return;
    const s = d.session;
    document.getElementById('avatar-host-name').textContent = s.host || '-';
    document.getElementById('avatar-guest-name').textContent = s.guest || '等待加入...';
    if(s.song && s.song.name) {
      document.getElementById('song-name').textContent = s.song.name;
      document.getElementById('song-artist').textContent = s.song.artist || '';
      if(s.song.url && audio.src !== s.song.url) {
        audio.src = s.song.url;
        audio.play().catch(() => {});
      }
    }
    if(audio.duration) {
      document.getElementById('time-current').textContent = formatTime(audio.currentTime);
      document.getElementById('time-total').textContent = formatTime(audio.duration);
      document.getElementById('progress-fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
    const box = document.getElementById('chat-box');
    box.innerHTML = (s.messages || []).map(m => {
      const cls = m.from === '系统' ? 'system' : (m.from === myName ? 'me' : 'ai');
      const avatar = m.from === '系统' ? '🎵' : (m.from === myName ? avatarHostEmoji : avatarGuestEmoji);
      return '<div class="chat-msg"><div class="chat-avatar">' + avatar + '</div><div class="chat-content"><div class="chat-name ' + cls + '">' + m.from + '</div><div class="chat-text">' + m.text + '</div><div class="chat-time">' + (m.time ? m.time.slice(11,16) : '') + '</div></div></div>';
    }).join('');
    box.scrollTop = box.scrollHeight;
  });
}

function formatTime(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return m + ':' + (sec < 10 ? '0' : '') + sec; }
function sendMsg() {
  const inp = document.getElementById('chat-msg');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  fetch('/api/listen/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session_id:sessionId, from:myName, text})});
}
function togglePlay() {
  if(isPlaying) { audio.pause(); document.getElementById('play-btn').textContent = '▶'; document.getElementById('record').classList.add('paused'); }
  else { audio.play(); document.getElementById('play-btn').textContent = '⏸'; document.getElementById('record').classList.remove('paused'); }
  isPlaying = !isPlaying;
}
function seekTo(e) { const bar = document.getElementById('progress-bar'); const pct = (e.clientX - bar.getBoundingClientRect().left) / bar.clientWidth; if(audio.duration) audio.currentTime = pct * audio.duration; }
function prevSong() { fetch('/api/listen/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session_id:sessionId, from:myName, text:'⏮ 切了上一首~'})}); }
function nextSong() { fetch('/api/listen/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session_id:sessionId, from:myName, text:'⏭ 切了下一首~'})}); }
audio.addEventListener('ended', () => { document.getElementById('play-btn').textContent = '▶'; document.getElementById('record').classList.add('paused'); isPlaying = false; });

// Auto-join if URL has id
if(sessionId) {
  document.getElementById('join-page').style.display = 'flex';
  document.getElementById('join-name').focus();
  // Pre-fill code inputs
  setTimeout(() => {
    const inputs = document.querySelectorAll('.code-input');
    for(let i = 0; i < Math.min(6, sessionId.length); i++) {
      inputs[i].value = sessionId[i];
    }
  }, 200);
}
</script>
</body>
</html>
