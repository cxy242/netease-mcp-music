<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>月汐音乐花园 - 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0e1a 0%, #1a1040 50%, #0a0e1a 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  overflow: hidden;
}
/* 背景粒子 */
.bg-particles {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.particle {
  position: absolute; border-radius: 50%; opacity: 0.3;
  animation: float linear infinite;
}
@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}
.login-container {
  position: relative; z-index: 1;
  width: 360px; max-width: 90vw;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 40px 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.logo {
  text-align: center; margin-bottom: 32px;
}
.logo-icon {
  font-size: 48px; margin-bottom: 8px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.logo-title {
  font-size: 24px; font-weight: 700;
  background: linear-gradient(135deg, #f8a4c8, #c3a6e8, #7ec8e3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-sub {
  font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 4px;
}
/* Tab 切换 */
.tabs {
  display: flex; gap: 0; margin-bottom: 24px;
  background: rgba(255,255,255,0.05);
  border-radius: 12px; padding: 4px;
}
.tab {
  flex: 1; padding: 10px; text-align: center;
  border-radius: 10px; cursor: pointer;
  font-size: 14px; font-weight: 600;
  color: rgba(255,255,255,0.5);
  transition: all 0.3s;
  border: none; background: none;
}
.tab.active {
  background: linear-gradient(135deg, #f8a4c8, #c3a6e8);
  color: #fff;
  box-shadow: 0 4px 15px rgba(200,150,200,0.3);
}
/* 表单 */
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block; font-size: 13px; color: rgba(255,255,255,0.6);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%; padding: 12px 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  color: #fff; font-size: 15px;
  outline: none; transition: all 0.3s;
}
.form-group input:focus {
  border-color: #f8a4c8;
  background: rgba(255,255,255,0.12);
  box-shadow: 0 0 20px rgba(248,164,200,0.15);
}
.form-group input::placeholder {
  color: rgba(255,255,255,0.3);
}
.submit-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #f8a4c8, #c3a6e8);
  border: none; border-radius: 14px;
  color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all 0.3s;
  margin-top: 8px;
}
.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(200,150,200,0.4);
}
.submit-btn:active {
  transform: translateY(0);
}
.submit-btn:disabled {
  opacity: 0.5; cursor: not-allowed; transform: none;
}
.error-msg {
  color: #ff6b6b; font-size: 13px; text-align: center;
  margin-top: 12px; min-height: 20px;
}
.success-msg {
  color: #4ade80; font-size: 13px; text-align: center;
  margin-top: 12px; min-height: 20px;
}
/* 表单切换动画 */
.form-panel {
  display: none;
}
.form-panel.active {
  display: block;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
/* 跳过登录 */
.skip-login {
  text-align: center; margin-top: 20px;
}
.skip-login a {
  color: rgba(255,255,255,0.4); font-size: 13px;
  text-decoration: none; cursor: pointer;
  transition: color 0.3s;
}
.skip-login a:hover {
  color: rgba(255,255,255,0.7);
}
</style>
</head>
<body>
<div class="bg-particles" id="bgParticles"></div>

<div class="login-container">
  <div class="logo">
    <div class="logo-icon">🌸</div>
    <div class="logo-title">月汐音乐花园</div>
    <div class="logo-sub">登录后享受个性化音乐体验</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">登录</button>
    <button class="tab" onclick="switchTab('register')">注册</button>
  </div>

  <!-- 登录表单 -->
  <div class="form-panel active" id="loginPanel">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="submit-btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <!-- 注册表单 -->
  <div class="form-panel" id="registerPanel">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="regUsername" placeholder="2-20个字符" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="regPassword" placeholder="至少4个字符" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="password" id="regPassword2" placeholder="再次输入密码" autocomplete="new-password">
    </div>
    <button class="submit-btn" id="regBtn" onclick="doRegister()">注 册</button>
    <div class="error-msg" id="regError"></div>
    <div class="success-msg" id="regSuccess"></div>
  </div>

  <div class="skip-login">
    <a onclick="skipLogin()">先逛逛，不登录 →</a>
  </div>
</div>

<script>
// 背景粒子
(function() {
  const container = document.getElementById('bgParticles');
  const colors = ['#f8a4c8', '#c3a6e8', '#7ec8e3', '#f0e68c', '#98fb98'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 6;
    p.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*10}s;`;
    container.appendChild(p);
  }
})();

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  if (tab === 'login') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('loginPanel').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('registerPanel').classList.add('active');
  }
}

async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.textContent = '';
  if (!username || !password) { err.textContent = '请输入用户名和密码'; return; }
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (data.ok) {
      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('user_info', JSON.stringify(data.user));
      window.location.href = '/';
    } else {
      err.textContent = data.message || '登录失败';
    }
  } catch(e) {
    err.textContent = '网络错误，请重试';
  }
  btn.disabled = false; btn.textContent = '登 录';
}

async function doRegister() {
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;
  const btn = document.getElementById('regBtn');
  const err = document.getElementById('regError');
  const success = document.getElementById('regSuccess');
  err.textContent = ''; success.textContent = '';
  if (!username || !password) { err.textContent = '请输入用户名和密码'; return; }
  if (password !== password2) { err.textContent = '两次密码不一致'; return; }
  btn.disabled = true; btn.textContent = '注册中...';
  try {
    const resp = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (data.ok) {
      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('user_info', JSON.stringify(data.user));
      window.location.href = '/';
    } else {
      err.textContent = data.message || '注册失败';
    }
  } catch(e) {
    err.textContent = '网络错误，请重试';
  }
  btn.disabled = false; btn.textContent = '注 册';
}

function skipLogin() {
  localStorage.setItem('guest_mode', 'true');
  window.location.href = '/';
}

// 回车提交
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('regPassword2').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

// 已登录则跳转
if (localStorage.getItem('auth_token')) {
  window.location.href = '/';
}
</script>
</body>
</html>
