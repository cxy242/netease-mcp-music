<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>个人中心 - 月汐音乐花园</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --glass:rgba(255,255,255,0.04);
  --glass-border:rgba(255,255,255,0.08);
  --glass-hover:rgba(255,255,255,0.08);
  --accent:#c084fc;
  --accent2:#f472b6;
  --accent3:#818cf8;
  --text:rgba(255,255,255,0.92);
  --text-dim:rgba(255,255,255,0.45);
  --text-faint:rgba(255,255,255,0.25);
  --radius:20px;
  --radius-sm:14px;
}
html{-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;
  background:#090b14;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC','Helvetica Neue',sans-serif;
  color:var(--text);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── Ambient background ── */
.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 60% at 15% 20%,rgba(168,85,247,.08) 0%,transparent 55%),
    radial-gradient(ellipse 70% 50% at 85% 70%,rgba(236,72,153,.06) 0%,transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 50%,rgba(99,102,241,.05) 0%,transparent 45%);
  animation:ambientDrift 20s ease-in-out infinite alternate;
}
@keyframes ambientDrift{
  0%{opacity:.7;transform:scale(1) rotate(0deg)}
  50%{opacity:1;transform:scale(1.05) rotate(1deg)}
  100%{opacity:.7;transform:scale(1) rotate(-1deg)}
}

/* Floating orbs */
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px)}
.orb-1{width:400px;height:400px;background:rgba(168,85,247,.06);top:-100px;left:-100px;animation:orbFloat1 25s ease-in-out infinite}
.orb-2{width:300px;height:300px;background:rgba(236,72,153,.05);bottom:-80px;right:-80px;animation:orbFloat2 30s ease-in-out infinite}
.orb-3{width:250px;height:250px;background:rgba(99,102,241,.04);top:50%;left:60%;animation:orbFloat3 22s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,80px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-60px)}}
@keyframes orbFloat3{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,50px)}}

.container{
  position:relative;z-index:1;
  max-width:440px;margin:0 auto;
  padding:20px 18px 48px;
}

/* ── Back button ── */
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 18px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:12px;
  color:var(--text-dim);
  font-size:13px;font-weight:500;text-decoration:none;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  margin-bottom:28px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.back-btn:hover{
  background:var(--glass-hover);
  color:var(--text);
  transform:translateX(-3px);
  border-color:rgba(255,255,255,0.12);
}
.back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── User Card ── */
.user-card{
  background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  border-radius:28px;
  padding:36px 24px 28px;
  margin-bottom:18px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.user-card::before{
  content:'';position:absolute;top:-1px;right:-1px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(168,85,247,.08),transparent 70%);
  border-radius:50%;
}
.user-card::after{
  content:'';position:absolute;bottom:-1px;left:-1px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(236,72,153,.06),transparent 70%);
  border-radius:50%;
}

/* Avatar */
.avatar-area{
  position:relative;display:inline-block;margin-bottom:18px;cursor:pointer;
}
.avatar-ring{
  position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 180deg,var(--accent),var(--accent2),var(--accent3),var(--accent));
  animation:ringRotate 6s linear infinite;
  opacity:.6;
}
@keyframes ringRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.avatar-ring::after{
  content:'';position:absolute;inset:3px;border-radius:50%;
  background:#0c0e18;
}
.avatar{
  width:90px;height:90px;border-radius:50%;
  background:linear-gradient(135deg,#a855f7,#ec4899,#6366f1);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:700;color:#fff;
  position:relative;z-index:1;
  box-shadow:0 8px 40px rgba(168,85,247,.2);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
}
.avatar-area:hover .avatar{transform:scale(1.05)}
.avatar-edit-hint{
  position:absolute;bottom:-2px;right:-2px;z-index:2;
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:3px solid #0c0e18;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}
.avatar-edit-hint svg{width:12px;height:12px;fill:#fff}

.username{
  font-size:22px;font-weight:700;letter-spacing:-.3px;
  position:relative;z-index:1;
}
.user-id{
  font-size:11px;color:var(--text-faint);
  margin-top:4px;position:relative;z-index:1;
  font-family:'SF Mono','Fira Code','JetBrains Mono',monospace;
  letter-spacing:.5px;
}
.admin-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;
  background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.1));
  border:1px solid rgba(251,191,36,.2);
  border-radius:20px;font-size:11px;font-weight:600;
  margin-top:14px;position:relative;z-index:1;
  color:#fbbf24;
}

/* ── Stats ── */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:18px;
}
.stat-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:18px;
  padding:20px 10px 16px;
  text-align:center;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:40px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.3),transparent);
}
.stat-card:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,0.12);
  background:var(--glass-hover);
}
.stat-dot{
  width:6px;height:6px;border-radius:50%;margin:0 auto 10px;
}
.stat-dot.purple{background:var(--accent);box-shadow:0 0 8px rgba(168,85,247,.4)}
.stat-dot.pink{background:var(--accent2);box-shadow:0 0 8px rgba(244,114,182,.4)}
.stat-dot.blue{background:var(--accent3);box-shadow:0 0 8px rgba(129,140,248,.4)}
.stat-num{
  font-size:28px;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
}
.stat-label{
  font-size:11px;color:var(--text-faint);
  margin-top:6px;letter-spacing:.8px;text-transform:uppercase;
}

/* ── Checkin Card ── */
.checkin-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:24px;
  padding:24px 20px;
  margin-bottom:18px;
}
.checkin-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.checkin-title{
  font-size:15px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:8px;
}
.checkin-title-dot{
  width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 10px rgba(168,85,247,.3);
}
.streak-pill{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;
  background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(245,158,11,.06));
  border:1px solid rgba(251,191,36,.15);
  border-radius:20px;font-size:12px;font-weight:600;
  color:#fbbf24;
}
.streak-pill svg{width:14px;height:14px;fill:#fbbf24}

/* Calendar grid */
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  margin-bottom:6px;
}
.cal-weekday{
  text-align:center;font-size:10px;color:var(--text-faint);
  padding:4px 0;font-weight:500;letter-spacing:.5px;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  margin-bottom:18px;
}
.cal-day{
  aspect-ratio:1;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:500;
  background:rgba(255,255,255,0.02);
  color:var(--text-dim);
  transition:all .3s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.cal-day.today{
  background:rgba(168,85,247,.08);
  color:var(--accent);
  border:1px solid rgba(168,85,247,.2);
  font-weight:700;
}
.cal-day.checked{
  background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(236,72,153,.15));
  color:#fff;font-weight:700;
  box-shadow:0 2px 10px rgba(168,85,247,.15);
}
.cal-day.checked.today{
  border-color:rgba(168,85,247,.4);
}
.cal-day .mood-dot{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  font-size:8px;line-height:1;
}

/* Checkin button */
.checkin-btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:var(--radius-sm);
  color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);
  box-shadow:0 4px 24px rgba(168,85,247,.25);
  letter-spacing:.5px;
}
.checkin-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(168,85,247,.35);
}
.checkin-btn:active{transform:translateY(0)}
.checkin-btn.done{
  background:rgba(74,222,128,.08);
  border:1px solid rgba(74,222,128,.2);
  color:#4ade80;
  box-shadow:none;
  cursor:default;
}
.checkin-btn.done:hover{transform:none}

/* ── Mood Modal ── */
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .35s cubic-bezier(.4,0,.2,1);
}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{
  background:linear-gradient(165deg,rgba(20,22,36,.98),rgba(14,16,28,.98));
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:32px 24px 24px;
  width:min(360px,90vw);
  transform:translateY(20px) scale(.96);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 24px 80px rgba(0,0,0,.5);
}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal-title{
  font-size:17px;font-weight:700;text-align:center;
  margin-bottom:24px;color:var(--text);
}
.mood-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:20px;
}
.mood-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 8px;
  background:var(--glass);
  border:1.5px solid var(--glass-border);
  border-radius:16px;
  cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.mood-item:hover{
  background:var(--glass-hover);
  border-color:rgba(255,255,255,.12);
  transform:translateY(-2px);
}
.mood-item.selected{
  background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(236,72,153,.08));
  border-color:rgba(168,85,247,.3);
  box-shadow:0 0 20px rgba(168,85,247,.1);
}
.mood-emoji{font-size:28px;line-height:1}
.mood-label{font-size:11px;color:var(--text-dim);font-weight:500}

.comment-input{
  width:100%;padding:12px 16px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:12px;
  color:var(--text);font-size:13px;
  outline:none;resize:none;
  font-family:inherit;
  transition:border-color .3s;
  margin-bottom:16px;
}
.comment-input::placeholder{color:var(--text-faint)}
.comment-input:focus{border-color:rgba(168,85,247,.3)}
.char-count{
  text-align:right;font-size:10px;color:var(--text-faint);
  margin-top:-12px;margin-bottom:14px;
}
.modal-btns{
  display:flex;gap:10px;
}
.modal-btn{
  flex:1;padding:13px;
  border:none;border-radius:12px;
  font-size:14px;font-weight:600;
  cursor:pointer;transition:all .3s;
}
.modal-btn.cancel{
  background:var(--glass);
  border:1px solid var(--glass-border);
  color:var(--text-dim);
}
.modal-btn.cancel:hover{background:var(--glass-hover);color:var(--text)}
.modal-btn.confirm{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:0 4px 16px rgba(168,85,247,.25);
}
.modal-btn.confirm:hover{
  box-shadow:0 6px 24px rgba(168,85,247,.35);
  transform:translateY(-1px);
}

/* ── Avatar Modal ── */
.avatar-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin-bottom:20px;
}
.avatar-option{
  aspect-ratio:1;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
  background:var(--glass);
  border:1.5px solid var(--glass-border);
  cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.avatar-option:hover{
  background:var(--glass-hover);
  border-color:rgba(255,255,255,.12);
  transform:scale(1.05);
}
.avatar-option.selected{
  background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(236,72,153,.1));
  border-color:var(--accent);
  box-shadow:0 0 20px rgba(168,85,247,.15);
}
.avatar-option-letter{
  font-size:28px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

/* ── Menu ── */
.section-gap{margin-bottom:18px}
.menu-group-title{
  font-size:11px;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:1.2px;
  padding:0 4px;margin-bottom:8px;font-weight:600;
}
.menu-item{
  display:flex;align-items:center;gap:14px;
  padding:15px 16px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:16px;
  margin-bottom:6px;
  cursor:pointer;
  transition:all .35s cubic-bezier(.4,0,.2,1);
}
.menu-item:hover{
  background:var(--glass-hover);
  transform:translateX(4px);
  border-color:rgba(255,255,255,.1);
}
.menu-item:active{transform:translateX(2px) scale(.99)}
.menu-icon{
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.menu-icon.purple{background:rgba(168,85,247,.1)}
.menu-icon.blue{background:rgba(99,102,241,.1)}
.menu-icon.pink{background:rgba(236,72,153,.1)}
.menu-icon.amber{background:rgba(251,191,36,.1)}
.menu-icon svg{width:18px;height:18px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.menu-icon.purple svg{color:var(--accent)}
.menu-icon.blue svg{color:var(--accent3)}
.menu-icon.pink svg{color:var(--accent2)}
.menu-icon.amber svg{color:#fbbf24}
.menu-text{flex:1;font-size:14px;font-weight:500}
.menu-arrow{
  color:var(--text-faint);font-size:16px;
  transition:transform .3s;
}
.menu-item:hover .menu-arrow{transform:translateX(3px)}

/* ── Bottom buttons ── */
.btn-group{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.action-btn{
  width:100%;padding:14px;
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;
  cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.action-btn svg{width:16px;height:16px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.action-btn.switch{
  background:rgba(99,102,241,.08);
  color:var(--accent3);
  border-color:rgba(99,102,241,.15);
}
.action-btn.switch:hover{background:rgba(99,102,241,.15)}
.action-btn.logout{
  background:rgba(244,114,182,.06);
  color:var(--accent2);
  border-color:rgba(244,114,182,.12);
}
.action-btn.logout:hover{background:rgba(244,114,182,.12)}

.footer-info{
  text-align:center;margin-top:28px;
  font-size:11px;color:var(--text-faint);
  letter-spacing:.3px;
}

/* ── Animations ── */
.fade-up{animation:fadeUp .7s cubic-bezier(.4,0,.2,1) forwards;opacity:0}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
.d1{animation-delay:.08s}
.d2{animation-delay:.16s}
.d3{animation-delay:.24s}
.d4{animation-delay:.32s}
.d5{animation-delay:.4s}
.d6{animation-delay:.48s}
.d7{animation-delay:.56s}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}

/* Toast */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);
  padding:12px 24px;
  background:linear-gradient(135deg,rgba(168,85,247,.9),rgba(236,72,153,.9));
  border-radius:14px;
  font-size:13px;font-weight:600;color:#fff;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  z-index:200;opacity:0;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  backdrop-filter:blur(12px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="ambient"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container">
  <!-- Back -->
  <a href="/" class="back-btn fade-up">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回首页
  </a>

  <!-- User Card -->
  <div class="user-card fade-up d1">
    <div class="avatar-area" id="avatarArea" onclick="openAvatarModal()">
      <div class="avatar-ring"></div>
      <div class="avatar" id="avatar">?</div>
      <div class="avatar-edit-hint">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
    </div>
    <div class="username" id="username">加载中...</div>
    <div class="user-id" id="userId"></div>
    <div id="adminBadge" style="display:none">
      <span class="admin-badge">
        <svg style="width:12px;height:12px;fill:#fbbf24;stroke:none" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        管理员
      </span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats fade-up d2">
    <div class="stat-card">
      <div class="stat-dot purple"></div>
      <div class="stat-num" id="favCount">0</div>
      <div class="stat-label">收藏</div>
    </div>
    <div class="stat-card">
      <div class="stat-dot pink"></div>
      <div class="stat-num" id="playCount">0</div>
      <div class="stat-label">播放</div>
    </div>
    <div class="stat-card">
      <div class="stat-dot blue"></div>
      <div class="stat-num" id="checkinCount">0</div>
      <div class="stat-label">打卡</div>
    </div>
  </div>

  <!-- Checkin -->
  <div class="checkin-card fade-up d3">
    <div class="checkin-header">
      <div class="checkin-title">
        <span class="checkin-title-dot"></span>
        本月打卡
      </div>
      <div class="streak-pill">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        连续 <span id="streak">0</span> 天
      </div>
    </div>
    <div class="cal-weekdays" id="calWeekdays"></div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">
      今日打卡
    </button>
  </div>

  <!-- Admin Menu -->
  <div class="section-gap fade-up d4" id="adminSection" style="display:none">
    <div class="menu-group-title">管理</div>
    <div class="menu-item" onclick="location.href='/admin'">
      <div class="menu-icon amber">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <span class="menu-text">管理后台</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <!-- Menu -->
  <div class="section-gap fade-up d5">
    <div class="menu-group-title">更多</div>
    <div class="menu-item" onclick="showAbout()">
      <div class="menu-icon pink">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </div>
      <span class="menu-text">关于音乐花园</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="btn-group fade-up d6">
    <button class="action-btn switch" onclick="doSwitch()">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11l-3 3-3-3"/></svg>
      切换账号
    </button>
    <button class="action-btn logout" onclick="doLogout()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      退出登录
    </button>
  </div>

  <div class="footer-info fade-up d7" id="footerInfo"></div>
</div>

<!-- Mood Modal -->
<div class="modal-overlay" id="moodModal">
  <div class="modal">
    <div class="modal-title">今天心情如何？</div>
    <div class="mood-grid" id="moodGrid"></div>
    <input class="comment-input" id="moodComment" placeholder="记录一下今天的心情..." maxlength="50">
    <div class="char-count"><span id="charCount">0</span>/50</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeMoodModal()">取消</button>
      <button class="modal-btn confirm" onclick="confirmCheckin()">打卡</button>
    </div>
  </div>
</div>

<!-- Avatar Modal -->
<div class="modal-overlay" id="avatarModal">
  <div class="modal">
    <div class="modal-title">选择头像</div>
    <div style="margin-bottom:16px;text-align:center">
      <label style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,#f8a4c8,#c3a6e8);border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;color:#fff;transition:all 0.3s">
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
        📷 从相册选择
      </label>
    </div>
    <div class="avatar-grid" id="avatarGrid"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeAvatarModal()">取消</button>
      <button class="modal-btn confirm" onclick="confirmAvatar()">确定</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Auth check ──
const token = localStorage.getItem('auth_token');
if (!token) window.location.href = '/login';
const headers = { 'Authorization': 'Bearer ' + token };

// ── Config ──
const AVATARS = ['default','🦊','🐱','🐰','🐻','🐼','🐨','🦄','🦋','🌸','🌙','⭐','🎵'];
const MOODS = [
  { emoji: '😊', label: '开心' },
  { emoji: '😌', label: '平静' },
  { emoji: '🥰', label: '甜蜜' },
  { emoji: '😢', label: '难过' },
  { emoji: '😤', label: '生气' },
  { emoji: '😴', label: '困倦' }
];

let currentSettings = {};
let selectedMood = null;
let selectedAvatar = 'default';
let userInitial = '?';

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Avatar rendering ──
function renderAvatar(value, initial) {
  const el = document.getElementById('avatar');
  if (value && value.startsWith('data:image/')) {
    el.innerHTML = '<img src="' + value + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
    el.style.fontSize = '';
    el.style.background = '';
  } else if (value && value !== 'default') {
    el.textContent = value;
    el.style.fontSize = '40px';
    el.style.background = 'linear-gradient(135deg, rgba(168,85,247,.2), rgba(236,72,153,.15))';
  } else {
    el.textContent = initial;
    el.style.fontSize = '36px';
    el.style.background = '';
  }
}

// ── Avatar Modal ──
function openAvatarModal() {
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = '';
  AVATARS.forEach(a => {
    const item = document.createElement('div');
    item.className = 'avatar-option' + (selectedAvatar === a ? ' selected' : '');
    if (a === 'default') {
      item.innerHTML = '<span class="avatar-option-letter">' + userInitial + '</span>';
    } else {
      item.textContent = a;
    }
    item.onclick = () => {
      grid.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      selectedAvatar = a;
    };
    grid.appendChild(item);
  });
  document.getElementById('avatarModal').classList.add('active');
}
function closeAvatarModal() {
  document.getElementById('avatarModal').classList.remove('active');
}
async function handleAvatarUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('图片不能超过2MB'); return; }
  const reader = new FileReader();
  reader.onload = async function(e) {
    const dataUrl = e.target.result;
    try {
      const resp = await fetch('/api/user/avatar', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ avatar: dataUrl })
      });
      const d = await resp.json();
      if (d.ok) {
        showToast('头像已更新');
        closeAvatarModal();
        loadProfile();
      } else {
        showToast(d.message || '上传失败');
      }
    } catch(err) { showToast('网络错误'); }
  };
  reader.readAsDataURL(file);
}

async function confirmAvatar() {
  try {
    currentSettings.avatar = selectedAvatar;
    const resp = await fetch('/api/user/settings', {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify(currentSettings)
    });
    const data = await resp.json();
    if (data.ok) {
      renderAvatar(selectedAvatar, userInitial);
      closeAvatarModal();
      showToast('头像已更新');
    }
  } catch(e) { console.error(e); }
}

// ── Mood Modal ──
function openMoodModal() {
  selectedMood = null;
  document.getElementById('moodComment').value = '';
  document.getElementById('charCount').textContent = '0';
  const grid = document.getElementById('moodGrid');
  grid.innerHTML = '';
  MOODS.forEach((m, i) => {
    const item = document.createElement('div');
    item.className = 'mood-item';
    item.innerHTML = '<span class="mood-emoji">' + m.emoji + '</span><span class="mood-label">' + m.label + '</span>';
    item.onclick = () => {
      grid.querySelectorAll('.mood-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      selectedMood = m.emoji;
    };
    grid.appendChild(item);
  });
  document.getElementById('moodModal').classList.add('active');
}
function closeMoodModal() {
  document.getElementById('moodModal').classList.remove('active');
}

// Character count
document.getElementById('moodComment').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length;
});

async function confirmCheckin() {
  if (!selectedMood) { showToast('请先选择一个心情'); return; }
  const comment = document.getElementById('moodComment').value.trim();
  const now = new Date();
  const key = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

  try {
    if (!currentSettings.checkins) currentSettings.checkins = {};
    currentSettings.checkins[key] = {
      mood: selectedMood,
      comment: comment || '',
      time: Date.now()
    };

    const resp = await fetch('/api/user/settings', {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify(currentSettings)
    });
    const data = await resp.json();
    if (data.ok) {
      closeMoodModal();
      loadCheckin();
      showToast('打卡成功 ' + selectedMood);
    }
  } catch(e) { console.error(e); }
}

function doCheckin() {
  const now = new Date();
  const key = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  if (currentSettings.checkins && currentSettings.checkins[key]) return;
  openMoodModal();
}

// ── Load checkin data ──
function loadCheckin() {
  fetch('/api/user/settings', { headers })
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return;
      currentSettings = d.settings || {};
      const checkins = currentSettings.checkins || {};
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const today = now.getDate();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();

      // Saved avatar
      selectedAvatar = currentSettings.avatar || 'default';

      // Weekday headers
      const wd = document.getElementById('calWeekdays');
      wd.innerHTML = '';
      ['日','一','二','三','四','五','六'].forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = d;
        wd.appendChild(el);
      });

      // Calendar grid
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      let checkedCount = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day';
        cell.textContent = day;
        const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
        const entry = checkins[key];
        if (entry) {
          cell.classList.add('checked');
          checkedCount++;
          // Show mood dot if entry has mood
          if (typeof entry === 'object' && entry.mood) {
            const dot = document.createElement('span');
            dot.className = 'mood-dot';
            dot.textContent = entry.mood;
            cell.appendChild(dot);
          }
        }
        if (day === today) cell.classList.add('today');
        grid.appendChild(cell);
      }

      document.getElementById('checkinCount').textContent = checkedCount;

      // Streak
      let streak = 0;
      for (let d = today; d >= 1; d--) {
        const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        if (checkins[key]) streak++;
        else break;
      }
      document.getElementById('streak').textContent = streak;

      // Today checked?
      const todayKey = year + '-' + String(month+1).padStart(2,'0') + '-' + String(today).padStart(2,'0');
      const btn = document.getElementById('checkinBtn');
      if (checkins[todayKey]) {
        const entry = checkins[todayKey];
        const moodText = (typeof entry === 'object' && entry.mood) ? ' ' + entry.mood : '';
        btn.textContent = '已打卡' + moodText;
        btn.classList.add('done');
        btn.disabled = true;
      } else {
        btn.textContent = '今日打卡';
        btn.classList.remove('done');
        btn.disabled = false;
      }
    });
}

// ── Load profile ──
async function loadProfile() {
  try {
    const resp = await fetch('/api/user/profile', { headers });
    const data = await resp.json();
    if (!data.ok) {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user_info');
      window.location.href = '/login';
      return;
    }

    const u = data.user;
    userInitial = u.username.charAt(0).toUpperCase();

    // Render avatar (will be overridden by saved avatar in loadCheckin)
    renderAvatar('default', userInitial);

    document.getElementById('username').textContent = u.username;
    document.getElementById('userId').textContent = 'ID ' + u.userId;
    document.getElementById('favCount').textContent = data.stats.favorites || 0;
    document.getElementById('playCount').textContent = data.stats.playCount || 0;

    if (u.isAdmin) {
      document.getElementById('adminBadge').style.display = 'block';
      document.getElementById('adminSection').style.display = 'block';
    }

    if (u.createdAt) {
      const created = new Date(u.createdAt).toLocaleDateString('zh-CN');
      const lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleString('zh-CN') : '未知';
      document.getElementById('footerInfo').textContent = '注册于 ' + created + ' · 上次登录 ' + lastLogin;
    }
  } catch(e) {
    console.error('Load profile failed:', e);
  }
}

// ── Actions ──
function doLogout() {
  if (confirm('确定要退出登录吗？')) {
    fetch('/api/logout', { method: 'POST' });
    localStorage.removeItem('auth_token');
    localStorage.removeItem('user_info');
    localStorage.removeItem('guest_mode');
    window.location.href = '/login';
  }
}

function doSwitch() {
  if (confirm('切换到其他账号？当前账号会退出。')) {
    fetch('/api/logout', { method: 'POST' });
    localStorage.removeItem('auth_token');
    localStorage.removeItem('user_info');
    localStorage.removeItem('guest_mode');
    window.location.href = '/login';
  }
}

function showAbout() {
  // Use a simple inline notification instead of alert
  showToast('月汐音乐花园 v1.0 — 音乐与温暖的小世界');
}

// Close modals on overlay click
document.getElementById('moodModal').addEventListener('click', function(e) {
  if (e.target === this) closeMoodModal();
});
document.getElementById('avatarModal').addEventListener('click', function(e) {
  if (e.target === this) closeAvatarModal();
});

// ── Init ──
loadProfile();
loadCheckin();
</script>
</body>
</html>
