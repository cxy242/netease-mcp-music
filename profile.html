<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>个人中心 - 月汐音乐花园</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: #0a0e1a;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

/* 动态背景 */
.bg-aurora {
  position: fixed; inset: 0; z-index: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 20% 40%, rgba(120,80,200,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 60%, rgba(255,100,150,0.1) 0%, transparent 50%),
    radial-gradient(ellipse 50% 30% at 50% 20%, rgba(80,180,255,0.08) 0%, transparent 40%);
  animation: auroraShift 12s ease-in-out infinite alternate;
}
@keyframes auroraShift {
  0% { opacity: 0.7; filter: hue-rotate(0deg); }
  50% { opacity: 1; filter: hue-rotate(30deg); }
  100% { opacity: 0.7; filter: hue-rotate(-20deg); }
}

/* 星星粒子 */
.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
.star {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle linear infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}

.container { 
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto; 
  padding: 20px 16px 40px;
}

/* 返回按钮 */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; 
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  color: rgba(255,255,255,0.7); 
  font-size: 14px; text-decoration: none;
  transition: all 0.3s; margin-bottom: 24px;
}
.back-btn:hover { 
  background: rgba(255,255,255,0.1); 
  color: #fff;
  transform: translateX(-2px);
}

/* 用户卡片 */
.user-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 32px 24px;
  margin-bottom: 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.user-card::before {
  content: '';
  position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(248,164,200,0.1), transparent, rgba(195,166,232,0.1), transparent);
  animation: cardGlow 8s linear infinite;
}
@keyframes cardGlow {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.avatar-wrapper {
  position: relative; display: inline-block; margin-bottom: 16px;
}
.avatar {
  width: 88px; height: 88px; border-radius: 50%;
  background: linear-gradient(135deg, #f8a4c8, #c3a6e8, #7ec8e3);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 800; color: #fff;
  position: relative; z-index: 1;
  box-shadow: 0 8px 32px rgba(248,164,200,0.3);
}
.avatar-ring {
  position: absolute; inset: -4px; border-radius: 50%;
  background: conic-gradient(from 0deg, #f8a4c8, #c3a6e8, #7ec8e3, #f8a4c8);
  animation: ringRotate 4s linear infinite;
  z-index: 0;
}
@keyframes ringRotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.avatar-ring::after {
  content: '';
  position: absolute; inset: 3px; border-radius: 50%;
  background: #0a0e1a;
}

.username { 
  font-size: 24px; font-weight: 700; 
  position: relative; z-index: 1;
  background: linear-gradient(135deg, #fff, rgba(255,255,255,0.8));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.user-id { 
  font-size: 12px; color: rgba(255,255,255,0.35); 
  margin-top: 4px; position: relative; z-index: 1;
  font-family: 'SF Mono', 'Fira Code', monospace;
}
.admin-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 14px;
  background: linear-gradient(135deg, #ff9800, #f57c00);
  border-radius: 20px; font-size: 12px; font-weight: 600;
  margin-top: 12px; position: relative; z-index: 1;
  box-shadow: 0 4px 16px rgba(255,152,0,0.3);
}

/* 统计卡片 */
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 20px 12px;
  text-align: center;
  transition: all 0.3s;
}
.stat-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08);
}
.stat-icon { font-size: 24px; margin-bottom: 8px; }
.stat-num { 
  font-size: 28px; font-weight: 800;
  background: linear-gradient(135deg, #f8a4c8, #c3a6e8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-label { 
  font-size: 12px; color: rgba(255,255,255,0.4); 
  margin-top: 4px; letter-spacing: 0.5px;
}

/* 打卡卡片 */
.checkin-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
}
.checkin-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.checkin-title { font-size: 16px; font-weight: 600; }
.checkin-streak {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px;
  background: linear-gradient(135deg, rgba(255,152,0,0.2), rgba(255,107,107,0.2));
  border-radius: 12px; font-size: 13px; font-weight: 600;
  color: #ff9800;
}
.checkin-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  margin-bottom: 16px;
}
.checkin-day {
  aspect-ratio: 1; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500;
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.3);
  transition: all 0.3s;
}
.checkin-day.today {
  border: 1px solid rgba(248,164,200,0.5);
  color: #f8a4c8;
}
.checkin-day.checked {
  background: linear-gradient(135deg, #f8a4c8, #c3a6e8);
  color: #fff; font-weight: 700;
  box-shadow: 0 2px 8px rgba(248,164,200,0.3);
}
.checkin-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #f8a4c8, #c3a6e8);
  border: none; border-radius: 14px;
  color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.3s;
  box-shadow: 0 4px 20px rgba(248,164,200,0.3);
}
.checkin-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(248,164,200,0.4);
}
.checkin-btn:active { transform: translateY(0); }
.checkin-btn:disabled {
  opacity: 0.5; cursor: not-allowed; transform: none;
}
.checkin-btn.done {
  background: linear-gradient(135deg, rgba(74,222,128,0.3), rgba(74,222,128,0.2));
  border: 1px solid rgba(74,222,128,0.3);
  color: #4ade80;
}

/* 菜单 */
.menu { margin-bottom: 20px; }
.menu-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.3s;
}
.menu-item:hover {
  background: rgba(255,255,255,0.08);
  transform: translateX(4px);
  border-color: rgba(255,255,255,0.12);
}
.menu-item:active { transform: translateX(2px) scale(0.99); }
.menu-icon { 
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.menu-icon.orange { background: rgba(255,152,0,0.15); }
.menu-icon.blue { background: rgba(100,200,255,0.15); }
.menu-icon.pink { background: rgba(248,164,200,0.15); }
.menu-text { flex: 1; font-size: 15px; font-weight: 500; }
.menu-arrow { 
  color: rgba(255,255,255,0.2); font-size: 18px;
  transition: transform 0.3s;
}
.menu-item:hover .menu-arrow { transform: translateX(4px); }

/* 退出按钮 */
.btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.logout-btn, .switch-btn {
  width: 100%; padding: 15px;
  border: none; border-radius: 14px;
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all 0.3s;
}
.logout-btn {
  background: rgba(255,107,107,0.12);
  border: 1px solid rgba(255,107,107,0.2);
  color: #ff6b6b;
}
.logout-btn:hover { background: rgba(255,107,107,0.2); }
.switch-btn {
  background: rgba(100,200,255,0.1);
  border: 1px solid rgba(100,200,255,0.15);
  color: #64c8ff;
}
.switch-btn:hover { background: rgba(100,200,255,0.18); }

.time-info {
  text-align: center; margin-top: 24px;
  font-size: 12px; color: rgba(255,255,255,0.25);
}

/* 动画 */
.fade-in { animation: fadeIn 0.6s ease forwards; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.delay-1 { animation-delay: 0.1s; opacity: 0; }
.delay-2 { animation-delay: 0.2s; opacity: 0; }
.delay-3 { animation-delay: 0.3s; opacity: 0; }
.delay-4 { animation-delay: 0.4s; opacity: 0; }
</style>
</head>
<body>
<div class="bg-aurora"></div>
<div class="stars" id="stars"></div>

<div class="container">
  <a href="/" class="back-btn fade-in">← 返回首页</a>

  <!-- 用户卡片 -->
  <div class="user-card fade-in delay-1">
    <div class="avatar-wrapper">
      <div class="avatar-ring"></div>
      <div class="avatar" id="avatar">?</div>
    </div>
    <div class="username" id="username">加载中...</div>
    <div class="user-id" id="userId"></div>
    <div id="adminBadge" style="display:none">
      <span class="admin-badge">👑 管理员</span>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats fade-in delay-2">
    <div class="stat-card">
      <div class="stat-icon">💖</div>
      <div class="stat-num" id="favCount">0</div>
      <div class="stat-label">收藏</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🎵</div>
      <div class="stat-num" id="playCount">0</div>
      <div class="stat-label">播放</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📅</div>
      <div class="stat-num" id="checkinCount">0</div>
      <div class="stat-label">打卡</div>
    </div>
  </div>

  <!-- 打卡 -->
  <div class="checkin-card fade-in delay-3">
    <div class="checkin-header">
      <div class="checkin-title">📅 本月打卡</div>
      <div class="checkin-streak">🔥 连续 <span id="streak">0</span> 天</div>
    </div>
    <div class="checkin-grid" id="checkinGrid"></div>
    <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">✨ 今日打卡</button>
  </div>

  <!-- 管理菜单 -->
  <div class="menu fade-in delay-3" id="adminMenu" style="display:none">
    <div class="menu-item" onclick="location.href='/admin'">
      <div class="menu-icon orange">👑</div>
      <span class="menu-text">管理后台</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <!-- 功能菜单 -->
  <div class="menu fade-in delay-4">
    <div class="menu-item" onclick="showAbout()">
      <div class="menu-icon pink">🌸</div>
      <span class="menu-text">关于音乐花园</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <!-- 按钮 -->
  <div class="btn-group fade-in delay-4">
    <button class="switch-btn" onclick="doSwitch()">🔄 切换账号</button>
    <button class="logout-btn" onclick="doLogout()">🚪 退出登录</button>
  </div>

  <div class="time-info" id="timeInfo"></div>
</div>

<script>
// 生成星星背景
(function() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = 1 + Math.random() * 2;
    star.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s;`;
    container.appendChild(star);
  }
})();

const token = localStorage.getItem('auth_token');
if (!token) window.location.href = '/login';

const headers = { 'Authorization': 'Bearer ' + token };

// 加载打卡数据
function loadCheckin() {
  fetch('/api/user/settings', { headers })
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return;
      const checkins = d.settings.checkins || {};
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const today = now.getDate();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();
      
      // 生成日历
      const grid = document.getElementById('checkinGrid');
      grid.innerHTML = '';
      
      // 星期标签
      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      weekDays.forEach(d => {
        const label = document.createElement('div');
        label.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.3);text-align:center;padding:4px 0;';
        label.textContent = d;
        grid.appendChild(label);
      });
      
      // 空白天数
      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }
      
      // 日期
      let checkedCount = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'checkin-day';
        cell.textContent = day;
        const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if (checkins[key]) {
          cell.classList.add('checked');
          checkedCount++;
        }
        if (day === today) cell.classList.add('today');
        grid.appendChild(cell);
      }
      
      document.getElementById('checkinCount').textContent = checkedCount;
      
      // 计算连续打卡天数
      let streak = 0;
      for (let d = today; d >= 1; d--) {
        const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (checkins[key]) streak++;
        else break;
      }
      document.getElementById('streak').textContent = streak;
      
      // 今天是否已打卡
      const todayKey = `${year}-${String(month+1).padStart(2,'0')}-${String(today).padStart(2,'0')}`;
      if (checkins[todayKey]) {
        const btn = document.getElementById('checkinBtn');
        btn.textContent = '✅ 今日已打卡';
        btn.classList.add('done');
        btn.disabled = true;
      }
    });
}

// 打卡
async function doCheckin() {
  const now = new Date();
  const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  
  try {
    const resp = await fetch('/api/user/settings', { headers });
    const data = await resp.json();
    if (!data.ok) return;
    
    const settings = data.settings;
    if (!settings.checkins) settings.checkins = {};
    settings.checkins[key] = Date.now();
    
    await fetch('/api/user/settings', {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify(settings)
    });
    
    loadCheckin();
  } catch(e) {
    console.error('Checkin failed:', e);
  }
}

// 加载个人资料
async function loadProfile() {
  try {
    const resp = await fetch('/api/user/profile', { headers });
    const data = await resp.json();
    if (!data.ok) {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user_info');
      window.location.href = '/login';
      return;
    }
    
    const u = data.user;
    document.getElementById('avatar').textContent = u.username.charAt(0).toUpperCase();
    document.getElementById('username').textContent = u.username;
    document.getElementById('userId').textContent = 'ID: ' + u.userId;
    document.getElementById('favCount').textContent = data.stats.favorites;
    document.getElementById('playCount').textContent = data.stats.playCount;
    
    if (u.isAdmin) {
      document.getElementById('adminBadge').style.display = 'block';
      document.getElementById('adminMenu').style.display = 'block';
    }
    
    if (u.createdAt) {
      const created = new Date(u.createdAt).toLocaleDateString('zh-CN');
      const lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleString('zh-CN') : '未知';
      document.getElementById('timeInfo').textContent = '注册于 ' + created + ' · 上次登录 ' + lastLogin;
    }
  } catch(e) {
    console.error('Load profile failed:', e);
  }
}

function doLogout() {
  if (confirm('确定要退出登录吗？')) {
    fetch('/api/logout', { method: 'POST' });
    localStorage.removeItem('auth_token');
    localStorage.removeItem('user_info');
    localStorage.removeItem('guest_mode');
    window.location.href = '/login';
  }
}

function doSwitch() {
  if (confirm('切换到其他账号？当前账号会退出。')) {
    fetch('/api/logout', { method: 'POST' });
    localStorage.removeItem('auth_token');
    localStorage.removeItem('user_info');
    localStorage.removeItem('guest_mode');
    window.location.href = '/login';
  }
}

function showAbout() {
  alert('月汐音乐花园 v1.0\n一个充满音乐与温暖的小世界 🌸');
}

// 初始化
loadProfile();
loadCheckin();
</script>
</body>
</html>
