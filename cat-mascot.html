<!-- 黑毛红瞳小猫 HTML -->
<div class="cat-mascot" id="catMascot">
  <!-- 气泡 -->
  <div class="cat-bubble" id="catBubble"></div>
  
  <!-- 粒子容器 -->
  <div class="cat-particles" id="catParticles"></div>
  
  <!-- 身体 -->
  <div class="cat-body-wrap">
    <!-- 尾巴 -->
    <div class="cat-tail"></div>
    
    <!-- 身体 -->
    <div class="cat-torso"></div>
    
    <!-- 前爪 -->
    <div class="cat-paws">
      <div class="cat-paw"></div>
      <div class="cat-paw"></div>
    </div>
    
    <!-- 头部 -->
    <div class="cat-head">
      <!-- 耳朵 -->
      <div class="cat-ear left"></div>
      <div class="cat-ear right"></div>
      
      <!-- 眼睛 -->
      <div class="cat-eyes">
        <div class="cat-eye"></div>
        <div class="cat-eye"></div>
      </div>
      
      <!-- 鼻子 -->
      <div class="cat-nose"></div>
      
      <!-- 嘴巴 -->
      <div class="cat-mouth"></div>
      
      <!-- 胡须 -->
      <div class="cat-whiskers">
        <div class="cat-whisker"></div>
        <div class="cat-whisker"></div>
        <div class="cat-whisker"></div>
        <div class="cat-whisker"></div>
        <div class="cat-whisker"></div>
        <div class="cat-whisker"></div>
      </div>
    </div>
    
    <!-- 挥爪 -->
    <div class="cat-paw-wave"></div>
  </div>
</div>
